<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design records</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc; --accent: #2f5d8a;
  --context: #7a7a74; --assumed: #2f6fb0; --met: #2e7d4f; --partly: #a86a00; --not: #b23a3a;
  --chip: #efeee9; --hover: #f0f4f8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #a3a29b; --line: #34332f; --accent: #8db7e0;
    --context: #a3a29b; --assumed: #79aee6; --met: #6cc191; --partly: #e0a845; --not: #ec7c7c;
    --chip: #2b2a27; --hover: #26303a;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #a3a29b; --line: #34332f; --accent: #8db7e0;
  --context: #a3a29b; --assumed: #79aee6; --met: #6cc191; --partly: #e0a845; --not: #ec7c7c;
  --chip: #2b2a27; --hover: #26303a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
header { padding: 20px 24px 0; max-width: 1400px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
nav { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; font: inherit; color: var(--muted); cursor: pointer; }
nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
nav input { margin-left: auto; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; min-width: 200px; }
main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 40px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 460px); gap: 20px; align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); padding: 16px; } #detail { position: static; max-height: none; } header { padding: 16px 16px 0; } nav input { min-width: 0; width: 100%; margin: 8px 0; } }
#detail { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
#detail:empty::before { content: "Select a constraint or a decision to see its links."; color: var(--muted); }
.group { margin-bottom: 22px; }
.group h2 { font-size: 15px; margin: 0 0 2px; }
.group p { color: var(--muted); margin: 0 0 8px; font-size: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.card:hover, .card.sel { background: var(--hover); border-color: var(--accent); }
.card .id { font-weight: 650; margin-right: 6px; }
.card .meta { color: var(--muted); font-size: 13px; margin-top: 4px; display: flex; gap: 8px; align-items: center; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.s-context { color: var(--context); } .s-assumed { color: var(--assumed); } .s-met { color: var(--met); }
.s-partly-met { color: var(--partly); } .s-not-met { color: var(--not); }
.chip { display: inline-block; background: var(--chip); border-radius: 5px; padding: 0 6px; margin: 2px 3px 2px 0; font-size: 13px; cursor: pointer; border: 0; color: var(--text); font-family: inherit; }
.chip.unmet { outline: 1px solid var(--not); color: var(--not); }
.brief section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.brief h2 { font-size: 15px; margin: 0 0 6px; }
.brief blockquote { margin: 0 0 8px; color: var(--text); }
table { border-collapse: collapse; width: 100%; background: var(--panel); }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; font-size: 14px; }
tr.row { cursor: pointer; } tr.row:hover, tr.row.sel { background: var(--hover); }
.matrix-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.matrix th, .matrix td { padding: 3px 5px; text-align: center; font-size: 13px; border: 1px solid var(--line); }
.matrix th.row-h { text-align: left; white-space: nowrap; position: sticky; left: 0; background: var(--panel); }
.matrix thead th { position: sticky; top: 0; background: var(--panel); cursor: pointer; }
.matrix td.cell { cursor: pointer; min-width: 26px; }
.matrix td.serves { color: var(--met); font-weight: 700; } .matrix td.cites { color: var(--muted); } .matrix td.unmet { color: var(--not); font-weight: 700; }
.legend { color: var(--muted); font-size: 13px; margin: 8px 0; }
#detail h2 { font-size: 18px; margin: 0 0 6px; }
#detail h3 { font-size: 14px; margin: 16px 0 4px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
#detail blockquote { border-left: 3px solid var(--line); margin: 6px 0; padding-left: 10px; }
#detail ul { padding-left: 18px; margin: 4px 0; }
#detail .md table { font-size: 13px; }
#detail code, .md code { background: var(--chip); padding: 0 3px; border-radius: 3px; font-size: 13px; }
.hidden { display: none !important; }
#load { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
footer { max-width: 1400px; margin: 0 auto; padding: 0 24px 24px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Design records</h1>
  <p class="sub">The brief, its constraints and the architecture decision records, read straight from <code>records.sqlite</code>. Read-only: change the database, then run <code>python -m design_records generate</code>.</p>
  <nav role="tablist">
    <button role="tab" data-tab="brief" aria-selected="true">Brief</button>
    <button role="tab" data-tab="constraints" aria-selected="false">Constraints</button>
    <button role="tab" data-tab="decisions" aria-selected="false">Decisions</button>
    <button role="tab" data-tab="matrix" aria-selected="false">Matrix</button>
    <input id="filter" type="search" placeholder="Filter by words or ID" aria-label="Filter">
  </nav>
</header>
<main>
  <div id="view"><div id="load">Loading <code>records.sqlite</code>…</div></div>
  <aside id="detail" aria-live="polite"></aside>
</main>
<footer id="foot"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
"use strict";
let db, ids = new Set(), tab = "brief", selected = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const rows = (sql, params = []) => {
  const st = db.prepare(sql); st.bind(params); const out = [];
  while (st.step()) out.push(st.getAsObject());
  st.free(); return out;
};
const standingClass = (s) => "s-" + s.replace(" ", "-");
const badge = (s) => `<span class="badge ${standingClass(s)}">${esc(s)}</span>`;
const adrFile = (d) => `${String(d.number).padStart(4, "0")}-${d.slug}.md`;
const repo = (path) => new URL("../../" + path, location.href).href;

// Markdown from the database: bare IDs become in-page links; relative links resolve from the page's folder.
function md(text, folder) {
  const linked = String(text ?? "").split("`").map((part, i) => i % 2 ? part :
    part.replace(/(?<![\w\[\/#.-])([BCURSTP][1-9])(?![\w\/])/g, (m) => ids.has(m) ? `[${m}](#c/${m})` : m)).join("`");
  const box = document.createElement("div"); box.className = "md";
  box.innerHTML = marked.parse(linked);
  const base = new URL(`../../${folder}/`, location.href);
  box.querySelectorAll("a[href]").forEach((a) => {
    const href = a.getAttribute("href");
    const record = href.match(/(?:^|\/)(\d{4})-[a-z0-9-]+\.md$/);
    if (record) a.setAttribute("href", "#d/" + Number(record[1]));
    else if (!/^(#|[a-z]+:)/i.test(href)) a.href = new URL(href, base).href;
  });
  return box.innerHTML;
}
const chip = (id, cls = "") => `<button class="chip ${cls}" data-c="${esc(id)}">${esc(id)}</button>`;

function matches(text) {
  const q = $("#filter").value.trim().toLowerCase();
  return !q || String(text).toLowerCase().includes(q);
}

function renderBrief() {
  const sections = rows("SELECT heading, text FROM brief_sections ORDER BY position");
  const added = rows("SELECT DISTINCT g.code, g.name, g.position FROM constraint_groups g JOIN constraints c ON c.group_code = g.code WHERE c.brief_section IS NULL ORDER BY g.position");
  let html = `<div class="brief">`;
  for (const s of sections) {
    const cs = rows("SELECT id, title, standing FROM constraints WHERE brief_section = ? ORDER BY group_code, position", [s.heading]);
    html += `<section><h2>${esc(s.heading)}</h2><blockquote>${esc(s.text)}</blockquote>
      <div>${cs.map((c) => `<button class="chip" data-c="${c.id}" title="${esc(c.title)}">${c.id} · ${esc(c.title)}</button>`).join("") || '<span class="legend">No constraint taken from this section.</span>'}</div></section>`;
  }
  for (const g of added) {
    const cs = rows("SELECT id, title FROM constraints WHERE group_code = ? AND brief_section IS NULL ORDER BY position", [g.code]);
    html += `<section><h2>${esc(g.name)} <span class="legend">(added since the brief)</span></h2>
      <div>${cs.map((c) => `<button class="chip" data-c="${c.id}">${c.id} · ${esc(c.title)}</button>`).join("")}</div></section>`;
  }
  return html + "</div>";
}

function renderConstraints() {
  let html = "";
  for (const g of rows("SELECT * FROM constraint_groups ORDER BY position")) {
    const cs = rows(`SELECT c.*, (SELECT count(DISTINCT number) FROM decision_constraints dc WHERE dc.constraint_id = c.id) AS n
                     FROM constraints c WHERE group_code = ? ORDER BY position`, [g.code])
      .filter((c) => matches(`${c.id} ${c.title} ${c.statement} ${c.meaning} ${c.mvp}`));
    if (!cs.length) continue;
    html += `<div class="group"><h2>${esc(g.name)} (${g.code})</h2><p>${esc(g.summary).replace(/\*\*/g, "")}</p><div class="cards">` +
      cs.map((c) => `<button class="card ${selected === "c/" + c.id ? "sel" : ""}" data-c="${c.id}"><span class="id">${c.id}</span>${esc(c.title)}
        <div class="meta">${badge(c.standing)}<span>${c.n} decision${c.n === 1 ? "" : "s"}</span></div></button>`).join("") + "</div></div>";
  }
  return html || '<p class="legend">Nothing matches the filter.</p>';
}

function renderDecisions() {
  const ds = rows("SELECT * FROM decisions ORDER BY number").filter((d) =>
    matches(`${d.number} ${d.title} ${d.summary} ${d.status} ` + rows("SELECT group_concat(body, ' ') AS b FROM decision_sections WHERE number = ?", [d.number])[0].b));
  if (!ds.length) return '<p class="legend">Nothing matches the filter.</p>';
  return `<table><thead><tr><th>ADR</th><th>Decision</th><th>Serves</th><th>Status</th></tr></thead><tbody>` +
    ds.map((d) => {
      const cs = rows("SELECT constraint_id AS id, relation FROM decision_constraints WHERE number = ? AND relation != 'cites' ORDER BY position", [d.number]);
      return `<tr class="row ${selected === "d/" + d.number ? "sel" : ""}" data-d="${d.number}"><td>${String(d.number).padStart(4, "0")}</td><td>${esc(d.summary)}</td>
        <td>${cs.map((c) => chip(c.id, c.relation === "not met" ? "unmet" : "")).join("")}</td><td>${esc(d.status)}</td></tr>`;
    }).join("") + "</tbody></table>";
}

function renderMatrix() {
  const ds = rows("SELECT number, title FROM decisions ORDER BY number");
  const links = {};
  for (const r of rows("SELECT number, constraint_id, relation FROM decision_constraints")) {
    const k = r.constraint_id + "/" + r.number;
    if (!links[k] || r.relation !== "cites") links[k] = r.relation;
  }
  const cs = rows("SELECT c.id, c.title, c.standing FROM constraints c JOIN constraint_groups g ON g.code = c.group_code ORDER BY g.position, c.position")
    .filter((c) => matches(`${c.id} ${c.title}`));
  const mark = {serves: ["●", "serves"], "not met": ["✕", "unmet"], cites: ["○", "cites"]};
  return `<p class="legend">● serves &nbsp; ○ cites &nbsp; ✕ not met (knowingly left open). Click a cell or a header.</p>
    <div class="matrix-wrap"><table class="matrix"><thead><tr><th class="row-h">Constraint</th>` +
    ds.map((d) => `<th data-d="${d.number}" title="${esc(d.title)}">${String(d.number).padStart(2, "0")}</th>`).join("") + "</tr></thead><tbody>" +
    cs.map((c) => `<tr><th class="row-h"><button class="chip" data-c="${c.id}">${c.id}</button> <span class="${standingClass(c.standing)}" title="${esc(c.standing)}">${esc(c.title)}</span></th>` +
      ds.map((d) => { const r = links[c.id + "/" + d.number]; return r ? `<td class="cell ${mark[r][1]}" data-d="${d.number}" title="${c.id} ${r} by ADR ${d.number}">${mark[r][0]}</td>` : "<td></td>"; }).join("") + "</tr>").join("") +
    "</tbody></table></div>";
}

function showConstraint(id) {
  const c = rows("SELECT c.*, g.name AS group_name, s.title AS source_title FROM constraints c JOIN constraint_groups g ON g.code = c.group_code JOIN sources s ON s.id = c.source_id WHERE c.id = ?", [id])[0];
  if (!c) return;
  const ds = rows("SELECT d.number, d.slug, d.title, d.status, dc.relation, dc.reason FROM decision_constraints dc JOIN decisions d ON d.number = dc.number WHERE dc.constraint_id = ? ORDER BY d.number", [id]);
  const files = rows("SELECT path, role FROM constraint_files WHERE constraint_id = ? ORDER BY role, path", [id]);
  const group = {serves: "Served by", "not met": "Left unmet by", cites: "Cited by"};
  let html = `<h2>${c.id}. ${esc(c.title)}</h2><div>${badge(c.standing)} <span class="legend">${esc(c.group_name)}</span></div>
    <blockquote>${esc(c.statement)}</blockquote>
    <h3>Source</h3><p>${esc(c.source_title)}${c.brief_section ? ", " + esc(c.brief_section.toLowerCase()) : ""}${c.source_note ? ". " : ""}</p>${c.source_note ? md(c.source_note, "docs/constraints") : ""}
    <h3>What it means for the design</h3>${md(c.meaning, "docs/constraints")}
    <h3>Where the MVP stands</h3>${md(c.mvp, "docs/constraints")}`;
  if (files.length) html += `<h3>Files</h3><ul>${files.map((f) => `<li>${esc(f.role)}: <a href="${repo(f.path)}"><code>${esc(f.path)}</code></a></li>`).join("")}</ul>`;
  for (const rel of ["serves", "not met", "cites"]) {
    const list = ds.filter((d) => d.relation === rel);
    if (list.length) html += `<h3>${group[rel]}</h3><ul>${list.map((d) => `<li><a href="#d/${d.number}">ADR ${String(d.number).padStart(4, "0")}</a> ${esc(d.title)}${d.reason ? ` <span class="legend">(${esc(d.reason)})</span>` : ""}</li>`).join("")}</ul>`;
  }
  if (!ds.length) html += "<h3>Decisions</h3><p class='legend'>None yet.</p>";
  html += `<p class="legend"><a href="${repo("docs/constraints/" + rows("SELECT page FROM constraint_groups WHERE code = ?", [c.group_code])[0].page)}#${c.id.toLowerCase()}">Generated page</a></p>`;
  $("#detail").innerHTML = html;
}

function showDecision(n) {
  const d = rows("SELECT * FROM decisions WHERE number = ?", [n])[0];
  if (!d) return;
  const cs = rows("SELECT dc.constraint_id AS id, dc.relation, dc.reason, c.title FROM decision_constraints dc JOIN constraints c ON c.id = dc.constraint_id WHERE dc.number = ? ORDER BY dc.position", [n]);
  const rel = rows("SELECT kind, other FROM decision_relations WHERE number = ? ORDER BY other", [n]);
  const by = rows("SELECT kind, number FROM decision_relations WHERE other = ? ORDER BY number", [n]);
  const files = rows("SELECT path, role FROM decision_files WHERE number = ? ORDER BY role, path", [n]);
  const sections = rows("SELECT heading, body FROM decision_sections WHERE number = ? ORDER BY position", [n]);
  const line = (r) => cs.filter((c) => c.relation === r).map((c) => `<li>${chip(c.id, r === "not met" ? "unmet" : "")} ${esc(c.title)}${c.reason ? ` <span class="legend">(${esc(c.reason)})</span>` : ""}</li>`).join("");
  let html = `<h2>ADR ${String(d.number).padStart(4, "0")}. ${esc(d.title)}</h2><p class="legend">${esc(d.status)} · ${esc(d.date)} · <a href="${repo("docs/adr/" + adrFile(d))}">generated page</a></p>`;
  if (d.notes) html += md(d.notes, "docs/adr");
  html += `<h3>Serves</h3><ul>${line("serves")}</ul>`;
  if (cs.some((c) => c.relation === "not met")) html += `<h3>Not met</h3><ul>${line("not met")}</ul>`;
  if (cs.some((c) => c.relation === "cites")) html += `<h3>Cites</h3><ul>${line("cites")}</ul>`;
  if (rel.length || by.length) html += `<h3>Related records</h3><ul>${rel.map((r) => `<li>${esc(r.kind)} <a href="#d/${r.other}">ADR ${String(r.other).padStart(4, "0")}</a></li>`).join("")}${by.map((r) => `<li>${esc(r.kind)} by <a href="#d/${r.number}">ADR ${String(r.number).padStart(4, "0")}</a></li>`).join("")}</ul>`;
  if (files.length) html += `<h3>Files</h3><ul>${files.map((f) => `<li>${esc(f.role)}: <a href="${repo(f.path)}"><code>${esc(f.path)}</code></a></li>`).join("")}</ul>`;
  for (const s of sections) html += `<h3>${esc(s.heading)}</h3>${md(s.body, "docs/adr")}`;
  $("#detail").innerHTML = html;
}

function render() {
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab));
  $("#view").innerHTML = {brief: renderBrief, constraints: renderConstraints, decisions: renderDecisions, matrix: renderMatrix}[tab]();
}

function route() {
  const [kind, value] = location.hash.slice(1).split("/");
  if (kind === "c" && ids.has(value)) { selected = "c/" + value; showConstraint(value); }
  else if (kind === "d" && value) { selected = "d/" + value; showDecision(Number(value)); }
  else if (["brief", "constraints", "decisions", "matrix"].includes(kind)) tab = kind;
  render();
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-c],[data-d],[data-tab]");
  if (!t) return;
  if (t.dataset.tab) { location.hash = t.dataset.tab; return; }
  location.hash = t.dataset.c ? "c/" + t.dataset.c : "d/" + t.dataset.d;
});
$("#filter").addEventListener("input", () => { if (tab === "brief") tab = "constraints"; render(); });
window.addEventListener("hashchange", route);

async function open(buffer) {
  const SQL = await initSqlJs({locateFile: (f) => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`});
  db = new SQL.Database(new Uint8Array(buffer));
  ids = new Set(rows("SELECT id FROM constraints").map((r) => r.id));
  const n = (t) => rows(`SELECT count(*) AS n FROM ${t}`)[0].n;
  $("#foot").textContent = `${n("constraints")} constraints in ${n("constraint_groups")} groups · ${n("decisions")} decisions · ${n("decision_constraints")} links to constraints · ${n("decision_files") + n("constraint_files")} links to files`;
  route();
}

fetch("records.sqlite").then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(open, () => {
  $("#view").innerHTML = `<div id="load"><p>Could not fetch <code>records.sqlite</code>. Serve the repository root (<code>uv run --frozen python -m http.server 8012 --bind 127.0.0.1</code>) and open <code>/design/records/</code>, or choose the file:</p><input type="file" accept=".sqlite,.db" id="pick"></div>`;
  $("#pick").addEventListener("change", async (e) => open(await e.target.files[0].arrayBuffer()));
});
</script>
</body>
</html>
