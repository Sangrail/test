,"position":3,"version":2},{"body":"Done for CSV, XLSX and Markdown tables. Readers: [`readers/csv.py`](../../engineering_search/indexing/readers/csv.py), [`readers/xlsx.py`](../../engineering_search/indexing/readers/xlsx.py) (`openpyxl`; a formula with no cached value is left empty and the file is `INDEXED_PARTIAL`), [`readers/markdown.py`](../../engineering_search/indexing/readers/markdown.py). Facts: [`indexing/facts.py`](../../engineering_search/indexing/facts.py), units in [`units.py`](../../engineering_search/units.py). Store: `source_tables`, `table_rows` and `facts` in [`store.py`](../../engineering_search/store.py). Projection and safety: [`sql.py`](../../engineering_search/sql.py). Service: `query_sql`, `sql_schema`, `table_row_evidence` in [`service.py`](../../engineering_search/service.py). HTTP: `POST /sql`, `GET /sql/schema`, `GET /evidence/{file_id}/tables/{n}/rows/{n}`. MCP tools in [`mcp_server.py`](../../engineering_search/mcp_server.py).\n\nTests: `tests/test_facts.py` (the rules), `tests/test_sql.py` (expected rows by hand from the fixtures, permissions, refused statements, audit, citations, the example queries in docs/MCP.md), `tests/test_mcp_stdio.py` (a real MCP client over stdio), `tests/test_no_leaks.py` (CSV and XLSX files included). Not done: tables in PDF files, facts from prose, bound parameters in `query_sql`.","heading":"Implementation","number":16,"position":4,"version":2},{"body":"An independent review on 28 October 2026 reproduced four errors in the text path:\n\n1. **A wrong parameter was `found`.** ADR 0013 checked the question words against the whole document. \"Roof load is not specified. Floor load limit is 5 kN/m².\" answered \"What is the roof load?\" with the floor load, status `found`. A list comparison could also qualify a document by a floor load for a roof load filter. This is the wrong answer that ADR 0013 exists to prevent (U4).\n2. **Forbidden files changed a user's results.** ADR 0006 checked permissions after the index lookup, and the lookup kept the 1,000 best passages from all files. Forbidden passages that ranked higher pushed permitted ones out. No forbidden text was shown, but a forbidden file changed what a user saw, which breaks R1 in spirit.\n3. **Signs were ignored.** \"-2 kN/m²\" compared as 2 kN/m².\n4. **Lists stopped at 200 documents** and `page` did not page them.","heading":"Context","number":17,"position":1,"version":1},{"body":"- **Bind the answer to the question words.** A question word is bound when it is in the selected sentence, its passage heading, the file path, or the document title. The title counts only if the first passage starts in the first three lines of the file or of its first page.\n- **Statuses:**\n  - `found`: every question word is bound to the sentence.\n  - `unverified` (new): the document has every question word, but the sentence does not name some of them (`unbound_words`). The value may be about something else. The user and the chat agent must see the warning.\n  - `partial`: some question words are not in the document (`missing_words`).\n  - `not_found`: no sentence states a value that matches enough question words.\n- **List comparisons need a bound line.** A document qualifies only if one line states a quantity that meets the comparison and every question word is bound to that line.\n- **Permissions before the limit.** Find the files that contain a query word, evaluate permissions on them (and apply `within`), and pass the permitted set into the FTS5 query. The 1,000-passage limit applies to permitted passages only.\n- **Signed numbers.** A leading minus is a sign. A hyphen inside a code (B-104) or a range (1-2 kN) is not.\n- **Page lists** at 200 documents, with the total `count`, `document_pages` and `truncated`.","heading":"Decision","number":17,"position":2,"version":1},{"body":"- Some answers that were `found` are now `unverified`. That costs apparent precision and gains trust: the service no longer presents an unbound value as the answer.\n- Binding is a word check. A sentence that names the subject can still state a different parameter. Facts from tables ([ADR 0016](0016-structured-facts-and-client-written-sql.md)) bind value to subject structurally; prose still relies on words.\n- The title rule is a heuristic until the readers return a title.\n- Adding forbidden files can no longer change a user's results. The index query is a little more complex (a temporary scope table joined inside the FTS5 query).","heading":"Consequences","number":17,"position":3,"version":1},{"body":"Done. `pick_answer()`, `list_documents()` and `title()` in [`answer.py`](../../engineering_search/answer.py); signed numbers in [`units.py`](../../engineering_search/units.py); `document_matches()` and `candidates(query, files)` in [`store.py`](../../engineering_search/store.py); the order of steps in `SearchService.search` ([`service.py`](../../engineering_search/service.py)). Tests: [`tests/test_binding.py`](../../tests/test_binding.py) (floor load not the roof answer, heading binds, list filter, signed values, forbidden passages past the candidate limit, list page 2), [`tests/test_no_leaks.py`](../../tests/test_no_leaks.py) (first five and last pages).","heading":"Implementation","number":17,"position":4,"version":1},{"body":"The use case asks for an answer in under 10 seconds (U3). The MVP was measured with one user at a time. With many users, it fails:\n\n- **One process serves one request at a time.** `SearchService.lock` is held from the file match to the audit write, and the index has one SQLite connection. Throughput is about 10 requests a second on the 148 test files, whatever the load.\n- **The constrained SQL path copies data for each request.** [ADR 0016](0016-structured-facts-and-client-written-sql.md) builds an in-memory projection of every permitted fact, then runs the statement. That costs about 2 µs a fact to build and 1 µs a fact to query the `components` view: 0.6 s at 200,000 facts, 3 s at 1,000,000. The build is under the service lock.\n- **The SQL step budget does not grow with the data.** At 200,000 facts, the 2,000,000-step budget stops even the standard S355 query, because `components` is a view that groups every fact.\n\nMeasured on 29 October 2026 (`scripts/load_test.py` on a macOS laptop, one process, mixed text questions and the S355 SQL query, JP, Kamal and Maya):\n\n| Requests at once | Before: slowest answer | Before: median |\n| --- | --- | --- |\n| 1 | 0.12 s | 0.12 s |\n| 100 | 10.3 s | 5.6 s |\n| 1,000 | 102 s | 51 s |\n\nA user who waits 100 s and then gets an answer, or a timeout, loses trust. A user who is told at once \"busy, try again in 5 s\" can act.\n\nNote that over local stdio ([ADR 0012](0012-mcp-server-for-the-chat-agent.md)) each chat client starts its own server process, so MCP users do not queue behind each other in one process; they share the machine and the SQLite files. The queue matters for the web service and for any shared remote server.","heading":"Context","number":18,"position":1,"version":1},{"body":"- **Admission control.** Before a search, read or SQL query runs, predict its time and refuse it at once if it cannot finish within the budget. With n = requests in flight + 1, the prediction is n × mean + 2 × √n × spread, from moving averages of the measured service time (smoothing 0.05; first guess 0.2 s, deliberately cautious). A request's own service time runs from the later of its arrival and the previous departure, so waiting is not counted as work.\n- **The budget is 8 s** (`SEARCH_BUDGET_SECONDS`), leaving 2 s of the 10 s target for the network, the chat client and the language model.\n- **Admit where the request arrives.** The HTTP middleware admits before the route waits for a worker thread, so time in the thread queue counts. Each MCP tool admits before it calls the service. Index operations and uploads are not admission-controlled.\n- **Tell the caller.** HTTP: 503 with a `Retry-After` header and `{\"busy\": true, \"retry_after_seconds\": n, \"message\": ...}`, and no evidence. MCP: the same object as the tool error; the server instructions tell the agent to report it and not to retry in a loop. The web page shows the message. `/index/status` shows the learnt service time, spread, requests in flight, refusals and capacity to the index team.\n- **Do not hide the limit.** Document the throughput, the SQL cost and the step-budget limit here, in [ARCHITECTURE.md](../../ARCHITECTURE.md) and in [TODO.md](../../TODO.md), until the scaling work below is done.","heading":"Decision","number":18,"position":2,"version":1},{"body":"Measured after the change, budget 8 s:\n\n| Requests at once | Answered | Slowest answer | Refused as busy | Slowest refusal |\n| --- | --- | --- | --- | --- |\n| 1 | 1 | 0.12 s | 0 | — |\n| 10 | 10 | 0.73 s | 0 | — |\n| 100 | about 50 | 5.7 s | about 50 | 0.02 s |\n| 1,000 | about 47 | 5.5 s | about 953 | 0.24 s |\n\n- Every answered request finished within the budget, and every refusal came back in under 0.25 s, with a retry time.\n- **The guarantee is bounded latency, not capacity.** Throughput is unchanged at about 10 a second per process. With 1,000 simultaneous requests, most users are told to retry.\n- The prediction is conservative: it admits about 50 per burst where about 75 would fit. That trades capacity for the guarantee. The 2 × √n × spread margin and the smoothing are tunable after measurement on real load.\n- A burst of slow requests (large SQL projections) raises the estimate, and the service refuses more until it falls again.\n- Admission is per process. Several processes behind a load balancer each admit on their own queue.\n\n### What must change to serve the company\n\nIn order of value; each is a milestone in [TODO.md](../../TODO.md):\n\n1. **Concurrent reads in one process.** One read connection per thread, each request in one read transaction (a WAL snapshot), and no global lock for searches. The index lock stays for writers. Python's GIL still limits the answer rules, so:\n2. **Several worker processes** (or machines) reading the same index, behind a load balancer. Sessions and the upload queue move out of process memory. Rough sizing at the test-data cost of 0.1 s a request: 1,000 users asking one question a minute is about 17 requests a second, so 3 to 4 workers at 60% load. The real repository must be measured.\n3. **SQL without a copy per request.** Cache projections by (permission-set fingerprint, index version), or enforce permissions inside a server database (row-level security, or views over a permitted-file table) so nothing is copied. Make `components` an indexed table, not a grouping view, and scale the step budget with the data.\n4. **A server search engine** (or a server database with full-text search) when one SQLite file is no longer enough.\n5. **Load tests in CI** at the expected size and concurrency, with the 10 s target as a gate.","heading":"Consequences","number":18,"position":3,"version":1},{"body":"Done for admission control. `Admission` and `Busy` in [`adapters.py`](../../engineering_search/adapters.py); `SearchService.admit()` in [`service.py`](../../engineering_search/service.py); `AdmissionMiddleware` in [`app.py`](../../engineering_search/app.py); `service.admit()` around each MCP tool in [`mcp_server.py`](../../engineering_search/mcp_server.py); `SEARCH_BUDGET_SECONDS` in [`runtime.py`](../../engineering_search/runtime.py). Tests: [`tests/test_admission.py`](../../tests/test_admission.py) (the prediction, worked by hand on a fake clock; 503 with Retry-After and no evidence). Load test: `uv run --frozen python -m scripts.load_test`. The scaling work above is not started.","heading":"Implementation","number":18,"position":4,"version":1},{"body":"The use case asks for an answer in under 10 seconds (U3). The MVP was measured with one user at a time. With many users, it fails:\n\n- **One process serves one request at a time.** `SearchService.lock` is held from the file match to the audit write, and the index has one SQLite connection. Throughput is about 10 requests a second on the 148 test files, whatever the load.\n- **The constrained SQL path copies data for each request.** [ADR 0016](0016-structured-facts-and-client-written-sql.md) builds an in-memory projection of every permitted fact, then runs the statement. That costs about 2 µs a fact to build and 1 µs a fact to query the `components` view: 0.6 s at 200,000 facts, 3 s at 1,000,000. The build is under the service lock.\n- **The SQL step budget does not grow with the data.** At 200,000 facts, the 2,000,000-step budget stops even the standard S355 query, because `components` is a view that groups every fact.\n\nMeasured on 29 October 2026 (`scripts/load_test.py` on a macOS laptop, one process, mixed text questions and the S355 SQL query, JP, Kamal and Maya):\n\n| Requests at once | Before: slowest answer | Before: median |\n| --- | --- | --- |\n| 1 | 0.12 s | 0.12 s |\n| 100 | 10.3 s | 5.6 s |\n| 1,000 | 102 s | 51 s |\n\nA user who waits 100 s and then gets an answer, or a timeout, loses trust. A user who is told at once \"busy, try again in 5 s\" can act.\n\nNote that over local stdio ([ADR 0012](0012-mcp-server-for-the-chat-agent.md)) each chat client starts its own server process, so MCP users do not queue behind each other in one process; they share the machine and the SQLite files. The queue matters for the web service and for any shared remote server.","heading":"Context","number":18,"position":1,"version":2},{"body":"- **Admission control.** Before a search, read or SQL query runs, predict its time and refuse it at once if it cannot finish within the budget. With n = requests in flight + 1, the prediction is n × mean + 2 × √n × spread, from moving averages of the measured service time (smoothing 0.05; first guess 0.2 s, deliberately cautious). A request's own service time runs from the later of its arrival and the previous departure, so waiting is not counted as work.\n- **The budget is 8 s** (`SEARCH_BUDGET_SECONDS`), leaving 2 s of the 10 s target for the network, the chat client and the language model.\n- **Admit where the request arrives.** The HTTP middleware admits before the route waits for a worker thread, so time in the thread queue counts. Each MCP tool admits before it calls the service. Index operations and uploads are not admission-controlled.\n- **Tell the caller.** HTTP: 503 with a `Retry-After` header and `{\"busy\": true, \"retry_after_seconds\": n, \"message\": ...}`, and no evidence. MCP: the same object as the tool error; the server instructions tell the agent to report it and not to retry in a loop. The web page shows the message. `/index/status` shows the learnt service time, spread, requests in flight, refusals and capacity to the index team.\n- **Do not hide the limit.** Document the throughput, the SQL cost and the step-budget limit here, in [ARCHITECTURE.md](../../ARCHITECTURE.md) and in [TODO.md](../../TODO.md), until the scaling work below is done.","heading":"Decision","number":18,"position":2,"version":2},{"body":"Measured after the change, budget 8 s:\n\n| Requests at once | Answered | Slowest answer | Refused as busy | Slowest refusal |\n| --- | --- | --- | --- | --- |\n| 1 | 1 | 0.12 s | 0 | — |\n| 10 | 10 | 0.73 s | 0 | — |\n| 100 | about 50 | 5.7 s | about 50 | 0.02 s |\n| 1,000 | about 47 | 5.5 s | about 953 | 0.24 s |\n\n- Every answered request finished within the budget, and every refusal came back in under 0.25 s, with a retry time.\n- **The guarantee is bounded latency, not capacity.** Throughput is unchanged at about 10 a second per process. With 1,000 simultaneous requests, most users are told to retry.\n- The prediction is conservative: it admits about 50 per burst where about 75 would fit. That trades capacity for the guarantee. The 2 × √n × spread margin and the smoothing are tunable after measurement on real load.\n- A burst of slow requests (large SQL projections) raises the estimate, and the service refuses more until it falls again.\n- Admission is per process. Several processes behind a load balancer each admit on their own queue.\n\n### What must change to serve the company\n\nIn order of value; each is a milestone in [TODO.md](../../TODO.md):\n\n1. **Concurrent reads in one process.** One read connection per thread, each request in one read transaction (a WAL snapshot), and no global lock for searches. The index lock stays for writers. Python's GIL still limits the answer rules, so:\n2. **Several worker processes** (or machines) reading the same index, behind a load balancer. Sessions and the upload queue move out of process memory. Rough sizing at the test-data cost of 0.1 s a request: 1,000 users asking one question a minute is about 17 requests a second, so 3 to 4 workers at 60% load. The real repository must be measured.\n3. **SQL without a copy per request.** Cache projections by (permission-set fingerprint, index version), or enforce permissions inside a server database (row-level security, or views over a permitted-file table) so nothing is copied. Make `components` an indexed table, not a grouping view, and scale the step budget with the data.\n4. **A server search engine** (or a server database with full-text search) when one SQLite file is no longer enough.\n5. **Load tests in CI** at the expected size and concurrency, with the 10 s target as a gate.","heading":"Consequences","number":18,"position":3,"version":2},{"body":"Done for admission control. `Admission` and `Busy` in [`adapters.py`](../../engineering_search/adapters.py); `SearchService.admit()` in [`service.py`](../../engineering_search/service.py); `AdmissionMiddleware` in [`app.py`](../../engineering_search/app.py); `service.admit()` around each MCP tool in [`mcp_server.py`](../../engineering_search/mcp_server.py); `SEARCH_BUDGET_SECONDS` in [`runtime.py`](../../engineering_search/runtime.py). Tests: [`tests/test_admission.py`](../../tests/test_admission.py) (the prediction, worked by hand on a fake clock; 503 with Retry-After and no evidence). Load test: `uv run --frozen python -m scripts.load_test`. The scaling work above is not started.","heading":"Implementation","number":18,"position":4,"version":2},{"body":"Trust fails quickly when search is wrong. A lead who gets one confident wrong load limit stops using the service. The tests prove that the code does what it was written to do, on the documents it was written for. They do not say how good the answers are, or how good they will be on real documents and real questions.\n\nThere are now three places where a question can go wrong:\n\n1. **Retrieval and text answers** (the service). Does the index find the right passage, and does the answer step choose the right sentence, with the right status?\n2. **Natural language to SQL** (the chat agent). [ADR 0016](0016-structured-facts-and-client-written-sql.md) gives the structured question to the MCP client's language model. The server makes the SQL safe, not right. A safe query can compare a demand with a capacity, miss S355J2 when asked for S355, read 5 N/m² as 5 kN/m², or drop a project filter. Nothing measured this.\n3. **The agent's reply.** The agent reads the tool result and writes its own words. It can drop a row, change a value, or present an `unverified` value as fact. Nothing checks this either.\n\nWhat existed on 29 October 2026: `scripts/evaluate.py` scores 16 text questions (Success@1 0.88, Success@5 1.00, MRR@10 0.90, Recall@10 0.90, answer correct 1.00, no leaks). The questions, the synonyms and the documents were written together by the same team, so the scores are optimistic ([docs/METRICS.md](../METRICS.md)). The SQL path had tests, not an evaluation.","heading":"Context","number":19,"position":1,"version":1},{"body":"Evaluate each of the three places separately, so a failure points at its cause.\n\n### 1. Retrieval and text answers\n\nKeep `scripts/evaluate.py` and `evaluation/questions.json`, and extend the set by kind:\n\n- **One value**: the answer comes from an expected file and contains the expected text; its status is the expected one (`found`, `unverified`, `partial`).\n- **Not stated**: questions whose correct result is `not_found`. A confident answer is a failure.\n- **Lists**: precision and recall of the document set, not only the first result.\n- **Paraphrases**: the same question in other words, to measure the synonym gap.\n- **Permissions**: the same question for each user; leaks must be 0.\n\nMetrics: Success@1 and @5, MRR@10, Recall@10, answer correct, status correct, not-found precision, list precision and recall, zero-result rate, leaks, latency p50 and p95.\n\n### 2. Natural language to SQL\n\nUse **execution accuracy**, not SQL text: many different statements are correct. A question passes when the client's result has exactly the expected rows (as `[subject, file_id]` pairs) or the expected value.\n\n- **The gold set**: [`evaluation/sql_questions.json`](../../evaluation/sql_questions.json), 13 questions with expected rows written by hand from the fixtures. Each names its **trap**: grade family, capacity versus demand, units, sign, project filter, a join through `table_rows`, permissions (Kamal), and \"no rows is the right answer\". Each has one reference SQL, and [`tests/test_sql_questions.py`](../../tests/test_sql_questions.py) checks that it gives the expected rows, so the gold set cannot drift from the extraction.\n- **Metrics**: execution accuracy; row precision and recall (partial credit shows what is missed); pass rate by trap; refused statements (the server's error messages should let the agent correct itself); tool calls and time per question.\n- **Repeat each question several times.** A language model does not answer the same way twice. Report pass@1 and the share that pass every time.\n- **Pin versions.** Record the client, its version and the model with every result. A model change is a new baseline.\n- **Coincidental success.** A wrong query can return the right rows on small data. Use several paraphrases per question and the traps to make that unlikely, and grow the fixtures where a trap is not yet decisive.\n\n### 3. The agent's reply and its choice of tool\n\n- **Fidelity**: every value and row in the reply appears in a tool result; no expected row is missing; `partial` and `unverified` warnings are passed on; no forbidden content. Check these deterministically first (subjects, numbers and file names in the reply against the tool results). Use a language-model judge only as a second opinion, with people checking a sample.\n- **Routing**: does the agent use SQL for filter and count questions, and text search for values in prose? A mixed set of questions, scored by which tools were called.\n\n### 4. The harness\n\n- The MCP server writes an opt-in trace (local file, evaluation only) of each tool call: the tool, the arguments (including the SQL), the row keys returned, any error and the time. It never writes passage text.\n- A script runs each client (`claude -p`, `codex exec`, `pi -p`) on each question as its user, reads the trace and the final reply, and scores them. Results go to `evaluation/results/` with the date, the client and model versions, and the per-question details.\n\n### 5. Gates and real questions\n\n- **Every commit** (in the test suite): the gold SQL set is valid, the retrieval evaluation runs, leaks are 0, and answer correct stays at 1.00 on the scored set.\n- **Before a release, or a model or client change**: the live-client evaluation for each supported client. No release with a permission leak or a fidelity failure; execution accuracy and the retrieval metrics must not fall below the last accepted baseline without a recorded reason.\n- **Real questions**: collect questions from engineering leads, with the answers and sources they expect ([design/DATA-PROFILE.md](../../design/DATA-PROFILE.md)). Keep about a third back from the developers. Only scores on the held-back set predict real use.","heading":"Decision","number":19,"position":2,"version":1},{"body":"- Each failure points at its layer: the index, the answer rules, the schema and its descriptions, the client's model, or the reply.\n- The live evaluation costs money and time per run, so it runs before releases, not on every commit.\n- The scores on synthetic data will stay optimistic until real, held-back questions exist. The documents say so ([docs/METRICS.md](../METRICS.md)).\n- Schema descriptions and tool instructions become things to tune against the SQL evaluation, like the synonym list for retrieval.","heading":"Consequences","number":19,"position":3,"version":1},{"body":"Partial.\n\n- Done: the retrieval evaluation ([`scripts/evaluate.py`](../../scripts/evaluate.py), 16 scored questions); the NL-to-SQL gold set with its validation test; the load test for the time budget ([ADR 0018](0018-admission-control-and-the-time-budget.md)).\n- Gates: only the gold-set check runs in the test suite, and `tests/test_no_leaks.py` asks every evaluation question for each user. The retrieval evaluation is run by hand. There is no CI.\n- Not done: the MCP trace, the live-client harness and its first baseline for Claude Code, Codex and Pi; not-found, list and paraphrase questions in the retrieval set; the fidelity and routing checks; real held-back questions. Each is a milestone in [TODO.md](../../TODO.md).","heading":"Implementation","number":19,"position":4,"version":1},{"body":"The brief states five things that already exist (C1 to C5). In particular, connectors and APIs already extract metadata, text and properties from supported files (C3).\n\nThe MVP still needs files to be read, stored and queried to run end to end, so it has its own readers for Markdown, PDF with a text layer, CSV and XLSX, its own SQLite stores, a local folder for a repository and local chat clients. Earlier records ([ADR 0001](0001-mvp-format-scope.md), [ADR 0003](0003-versioned-reader-selection.md), [ADR 0005](0005-coverage-and-reader-gaps.md)) describe the readers as if extraction were part of this work. Read that way, the MVP appears to ignore the constraint and to propose rebuilding what the company already has.","heading":"Context","number":20,"position":1,"version":1},{"body":"- Treat C1 to C5 as given. The MVP does not design or build them.\n- Where the MVP needs one of them to run, use the simplest stand-in that proves the chain from question to cited answer, and name it as a stand-in:\n\n| In the brief | Stand-in in the MVP | In a real deployment |\n| --- | --- | --- |\n| C1 an architecture direction | One search service behind an HTTP API, a web page and an MCP server | The existing architecture calls the same service |\n| C2 an existing repository | A local folder of test files, and folder rules for permissions | The repository, its versions and its permissions, through its connector |\n| C3 connectors extract metadata, text and properties | Readers for Markdown, PDF text layer, CSV and XLSX | The existing connectors and APIs, each behind the reader interface |\n| C4 structured and semantic stores | SQLite: an FTS5 index, tables and typed facts | The company's stores |\n| C5 a chat-agent shell | Claude Code, Codex and Pi over a local MCP server | The company's chat-agent shell, over remote MCP or its tool API |\n\n- The work that is the MVP's own is what sits between these: knowing the questions, what to take from tables and how to type it, permissions before limits, binding an answer to its subject, citations, constrained SQL, the time budget, and the tests and evaluation.\n- The reader interface (`ReaderManifest`, `Extraction`) is where a connector plugs in: an adapter returns the same passages and tables, with source locations and a version.","heading":"Decision","number":20,"position":2,"version":1},{"body":"- Better PDF or Markdown parsing is not MVP work. A gap in a stand-in reader is recorded, not fixed, unless it breaks the chain.\n- The format scope of [ADR 0001](0001-mvp-format-scope.md) (S2) is the scope of the stand-ins, not of the product.\n- Reader selection and coverage ([ADR 0003](0003-versioned-reader-selection.md), [ADR 0005](0005-coverage-and-reader-gaps.md)) stay: the service must still know what read each file, in which version, and which files nothing could read. With real connectors they record the connector's name and version.\n- The quality of real connector output (OCR, tables in PDF files, CAD properties) is unknown, and must be profiled on the real repository ([design/DATA-PROFILE.md](../../design/DATA-PROFILE.md)).","heading":"Consequences","number":20,"position":3,"version":1},{"body":"Done in the documents: [docs/README.md](../README.md#what-is-assumed-and-what-stands-in-for-it), the constraint pages (C1 to C5 have the standing *assumed* and list their stand-ins), and the docstring of the reader package, [`engineering_search/indexing/readers/__init__.py`](../../engineering_search/indexing/readers/__init__.py). No behaviour changed.","heading":"Implementation","number":20,"position":4,"version":1},{"body":"The constraints are cited by every decision record and by other documents. The links, the Serves column of the index and the lists of citing records were kept by hand, and they drifted: the index listed R1 for [ADR 0018](0018-admission-control-and-the-time-budget.md) when the record did not, [ADR 0016](0016-structured-facts-and-client-written-sql.md) lacked S4, and a link pointed at a heading that had been removed. Code paths in records go stale when files move. An agent changing the code had no structured way to find the decisions that govern a file.","heading":"Context","number":21,"position":1,"version":1},{"body":"- **One SQLite database**, `design/records/records.sqlite`, holds the brief verbatim by section, the constraint groups and constraints with their standing, the decision records (metadata, notes and sections), and the links between them: which constraints a decision serves, leaves unmet or cites; which decisions supersede, amend or extend which; which files implement, test or measure a decision; and which files stand in for, enforce, measure or deliver a constraint. It is only a tracking database for the design; the product does not read it.\n- **It is the source.** `python -m design_records generate` writes every ADR page, the ADR index, the constraint pages and a SQL dump (`records.sql`) for review in diffs. Each generated page says so at the top. docs/README.md and the dated design inputs stay hand-written.\n- **A check runs in the suite** ([`tests/test_design_records.py`](../../tests/test_design_records.py)). It fails when a generated page differs from what the database produces; a file named in the database does not exist; a decision mentions a constraint or a code file that it does not link; the brief in the database differs from docs/Starting_document.md; a link or anchor in a generated page is broken; or a foreign key is broken.\n- **A read-only MCP server** (`python -m design_records mcp`) gives an agent the records during development: an overview, a constraint or a decision with its links, a search, the decisions and constraints that govern a file, the check, and read-only SQL. AGENTS.md tells agents to consult it before a design change. It is registered for Claude Code in `.mcp.json`.\n- **A browser view** (`design/records/index.html`) reads the SQLite file directly with sql.js and shows the brief with its constraints, each constraint and decision with its links and files, and a matrix of constraints against decisions. It changes nothing.","heading":"Decision","number":21,"position":2,"version":1},{"body":"- A change to a decision is an edit to the database, then `generate`. Editing a generated page by hand fails the test. The edit is less convenient than editing Markdown: the `sqlite3` shell's `edit()` function opens a text field in an editor.\n- The database is binary in git. `records.sql` is the form to review; the check keeps it in step.\n- Prose stays in text fields. The database checks that the structure, the links and the files are consistent, not that the words are right.\n- To be evaluated after a few real changes. If editing prose in SQLite is too awkward, keep the structure in the database and move the prose to files that it references. Write tools for the MCP server are a later option; for now every write goes through `generate` and the check.\n- **No history yet.** Rows are updated in place, so the database cannot say what a constraint said when a decision was made, which decisions rest on a constraint that has since changed, or which records are active and which displaced. Before the records become a living spec that features work within, they need append-only versions, links from decisions to the constraint versions they were made under, features as records, and proposals instead of writes for agents. The weaknesses and the design are in [design/records/README.md](../../design/records/README.md#weaknesses-and-what-comes-next).\n- **A binary source does not merge.** Two branches that change records conflict on the database file. Making text files the source, with SQLite built from them as an index, is the likely next step and is to be decided before history is built.","heading":"Consequences","number":21,"position":3,"version":1},{"body":"Done. Schema, rendering and checks: [`design_records/records.py`](../../design_records/records.py). MCP server: [`design_records/mcp_server.py`](../../design_records/mcp_server.py). Database, dump, view and how to edit: [design/records/](../../design/records/README.md). Tests: [`tests/test_design_records.py`](../../tests/test_design_records.py) (the generated pages match the database, the records are consistent, and each check fails on a broken copy of the database; the MCP tools return the links from the database).","heading":"Implementation","number":21,"position":4,"version":1},{"body":"The constraints are cited by every decision record and by other documents. The links, the Serves column of the index and the lists of citing records were kept by hand, and they drifted: the index listed R1 for [ADR 0018](0018-admission-control-and-the-time-budget.md) when the record did not, [ADR 0016](0016-structured-facts-and-client-written-sql.md) lacked S4, and a link pointed at a heading that had been removed. Code paths in records go stale when files move. An agent changing the code had no structured way to find the decisions that govern a file.","heading":"Context","number":21,"position":1,"version":2},{"body":"- **One SQLite database is the source of truth**, `docs/records/design.sqlite`, with its schema in [`design_records/schema.sql`](../../design_records/schema.sql). It holds the brief verbatim by section; the items of intent, constraint and scope, each with its pillar and standing; the decision records; and the links between them and to the files of the repository. It is a tracking database for the design; the product does not read it.\n- **Every record is versioned and append-only.** An item or a decision has a stable ID and a list of versions: *proposed* (a draft), *active* (at most one), *displaced* or *withdrawn*, each with its reason, author and dates. Triggers refuse edits and deletes of active and past versions. Changes are plain SQL in the `sqlite3` shell, through views: an update of `constraint_current` or `decision_current` adds a version and displaces the old one; `drafts` holds versions being written; a delete withdraws a record and keeps its history.\n- **A decision link records the item version it was made under.** When the wording or meaning of an item changes, or it is withdrawn, the `needs_review` view lists the decisions made under the old version until a review confirms them or a new version changes them. A new assessment (standing, where the MVP stands) does not.\n- **The documents are build artefacts.** `python -m design_records generate` writes every ADR page, the ADR index, the constraint pages, a SQL dump (`docs/records/design.sql`) for review in diffs, and a self-contained browser view (`docs/records/index.html`) of the pillars, the decisions, a timeline of every change and a matrix. A pre-commit hook (`.githooks/pre-commit`) runs it and stages the result. Nobody edits these files.\n- **A check runs in the suite** ([`tests/test_design_records.py`](../../tests/test_design_records.py)). It fails when a generated file differs from what the database produces; the database schema differs from schema.sql; a file named in the database does not exist; a decision mentions an item or a code file that it does not link; the brief differs from docs/Starting_document.md; a link is broken; or a foreign key is broken. Open drafts, decisions that need review and scope items not met are warnings.\n- **An MCP server** (`python -m design_records mcp`) gives an agent the records while it works: the records that govern a file, an item or a decision with its history, what needs review, drafts, search, the check and read-only SQL. It can propose a change, which becomes a draft. It cannot activate one: a person does, so an agent cannot change the spec to fit its code.","heading":"Decision","number":21,"position":2,"version":2},{"body":"- The database, not the git history, says what an item said when a decision was made, which decisions rest on items that have changed since, and what is active and what displaced.\n- The database is binary in git, so two branches that change records conflict on it and git cannot merge them. `design.sql` makes a change reviewable but does not merge. The alternative, a text dump as the source with SQLite built from it, keeps merging but makes the database a derived copy; the product owner chose the database as the source. With one writer this holds; with several, it is the first thing to break.\n- Prose is in text columns. The check keeps the structure, the links and the files consistent, not the words true. Standing is typed by hand, not derived from evidence.\n- To be evaluated after a few real changes. The review of the approach, and what a living specification still needs, are in [docs/records/README.md](../records/README.md#weaknesses-and-what-comes-next).","heading":"Consequences","number":21,"position":3,"version":2},{"body":"Done. Schema: [`design_records/schema.sql`](../../design_records/schema.sql). Rendering and checks: [`design_records/records.py`](../../design_records/records.py), with the template of the browser view, [`design_records/viewer.html`](../../design_records/viewer.html). MCP server: [`design_records/mcp_server.py`](../../design_records/mcp_server.py). Database, dump, view and how to change the records: [docs/records/](../records/README.md). Tests: [`tests/test_design_records.py`](../../tests/test_design_records.py) (the generated files match the database; a change adds a version and cannot rewrite the past; a changed item flags the decisions made under it; each check fails on a broken copy; the viewer needs no network; the MCP server proposes drafts and cannot activate them).","heading":"Implementation","number":21,"position":4,"version":2}],"sources":[{"date":null,"id":"brief","path":"docs/Starting_document.md","title":"The brief"},{"date":"2026-10-29","id":"inputs","path":"docs/CODEX_ENGINEERING_SEARCH_HANDOFF.md","title":"The 29 October design inputs"},{"date":"2026-10-28","id":"mvp","path":null,"title":"A decision during the MVP"},{"date":"2026-10-29","id":"owner","path":null,"title":"The product owner, during the MVP"},{"date":null,"id":"production","path":null,"title":"Required of a service for the whole organisation"}]};

// --- Indexes ---------------------------------------------------------------------------
const by = (rows, key) => rows.reduce((m, r) => ((m[r[key]] ||= []).push(r), m), {});
const groups = Object.fromEntries(DATA.groups.map(g => [g.code, g]));
const sources = Object.fromEntries(DATA.sources.map(s => [s.id, s]));
const itemVersions = by(DATA.item_versions, "constraint_id");
const itemFiles = DATA.item_files;
const decisionVersions = by(DATA.decision_versions, "number");
const slugs = Object.fromEntries(DATA.decisions.map(d => [d.number, d.slug]));
const key = (n, v) => n + "/" + v;
const sections = by(DATA.sections.map(s => ({...s, k: key(s.number, s.version)})), "k");
const links = by(DATA.links.map(s => ({...s, k: key(s.number, s.version)})), "k");
const relations = by(DATA.relations.map(s => ({...s, k: key(s.number, s.version)})), "k");
const dfiles = by(DATA.files.map(s => ({...s, k: key(s.number, s.version)})), "k");
const reviews = by(DATA.reviews, "number");
const needsReview = by(DATA.needs_review, "number");
const latest = vs => vs.find(v => v.lifecycle === "active") || vs[vs.length - 1];
const items = DATA.items.map(i => ({...i, versions: itemVersions[i.id] || []})).filter(i => i.versions.length)
  .map(i => ({...i, cur: latest(i.versions)}));
const itemById = Object.fromEntries(items.map(i => [i.id, i]));
const decisions = DATA.decisions.map(d => ({...d, versions: decisionVersions[d.number] || []})).filter(d => d.versions.length)
  .map(d => ({...d, cur: latest(d.versions)}));
const decisionByNumber = Object.fromEntries(decisions.map(d => [d.number, d]));
const curLinks = d => links[key(d.number, d.cur.version)] || [];
const pad = n => String(n).padStart(4, "0");
const day = s => (s || "").slice(0, 10);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const cls = s => String(s || "").replace(/\s+/g, "-");

// --- A small Markdown renderer, enough for the records ---------------------------------
const idPattern = new RegExp("(^|[^\\w\\[/#.-])([" + DATA.groups.map(g => g.code).join("") + "][1-9])(?![\\w/])", "g");
function href(target) {
  let m;
  if ((m = target.match(/(?:^|\/)(\d{4})-[\w-]+\.md$/))) return "#d/" + Number(m[1]);
  if ((m = target.match(/constraints\/[\w-]+\.md#([a-z]\d+)$/i)) || (m = target.match(/^[\w-]+\.md#([a-z]\d)$/i))) return "#c/" + m[1].toUpperCase();
  if (/^(https?:|mailto:|#)/.test(target)) return target;
  return "../adr/" + target;   // text in the database is written relative to docs/adr
}
function inline(text) {
  const code = [];
  let s = esc(text).replace(/`([^`]+)`/g, (_, c) => (code.push(c), "\u0000" + (code.length - 1) + "\u0000"));
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => `<a href="${esc(href(u.replace(/&amp;/g, "&")))}">${t}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>");
  s = s.split(/(<a [^>]*>.*?<\/a>)/).map((part, i) => i % 2 ? part :
    part.replace(idPattern, (all, pre, id) => itemById[id] ? `${pre}<a href="#c/${id}">${id}</a>` : all)).join("");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${code[i]}</code>`);
}
function md(text) {
  const lines = String(text || "").split("\n"), out = [];
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    if (line.startsWith("```")) {
      const body = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) body.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(body.join("\n"))}</code></pre>`); continue;
    }
    if (/^#{1,6} /.test(line)) { out.push(`<h4>${inline(line.replace(/^#+ /, ""))}</h4>`); i++; continue; }
    if (/^\s*\|/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push("<div class='table-wrap'><table><thead><tr>" + cells(body[0]).map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>"
        + body.slice(1).map(r => "<tr>" + cells(r).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table></div>");
      continue;
    }
    if (/^\s*([-*]|\d+\.) /.test(line)) {
      const ordered = /^\s*\d+\./.test(line), list = [];
      while (i < lines.length && (/^\s*([-*]|\d+\.) /.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && list.length))) {
        if (/^\s*([-*]|\d+\.) /.test(lines[i])) list.push(lines[i].replace(/^\s*([-*]|\d+\.) /, ""));
        else list[list.length - 1] += " " + lines[i].trim();
        i++;
      }
      out.push(`<${ordered ? "ol" : "ul"}>` + list.map(l => `<li>${inline(l)}</li>`).join("") + `</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (line.startsWith(">")) {
      const quote = [];
      while (i < lines.length && lines[i].startsWith(">")) quote.push(lines[i++].replace(/^> ?/, ""));
      out.push(`<blockquote>${md(quote.join("\n"))}</blockquote>`); continue;
    }
    if (!line.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6} |```|>|\s*\||\s*([-*]|\d+\.) )/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${inline(para.join(" "))}</p>`);
  }
  return `<div class="md">${out.join("")}</div>`;
}

// --- Views -----------------------------------------------------------------------------
const PILLARS = [
  ["intent", "Intent", "What the system is for: the direction every decision flows from."],
  ["constraint", "Constraints", "What the system must work within: environment, data and rules it must keep."],
  ["scope", "Scope", "How far this work goes down the road. The arbiter: going beyond a scope item is acceptable and recorded; falling short is the failure to flag."],
];
const PASSIVE = {"extends": "extended", "amends": "amended", "supersedes in part": "superseded in part"};
const RELATION_LABEL = {"serves": "serves", "not met": "leaves unmet", "exceeds": "goes beyond", "cites": "cites"};
const badge = s => `<span class="badge s-${cls(s)}">${esc(s)}</span>`;
const chip = (id, rel) => `<button class="chip r-${cls(rel || "serves")}" data-go="#c/${esc(id)}" title="${esc(RELATION_LABEL[rel] || "")}">${esc(id)}</button>`;
const dchip = n => `<button class="chip" data-go="#d/${n}">ADR ${pad(n)}</button>`;
const filterText = () => document.getElementById("q").value.trim().toLowerCase();
const matches = (...parts) => { const q = filterText(); return !q || parts.join(" ").toLowerCase().includes(q); };

function viewPillars() {
  return `<p class="lead">Every item from the brief and since, by pillar. The group letter in an ID says where the item came from; the pillar says what kind of item it is. Withdrawn items are listed last, with their history.</p>`
    + PILLARS.map(([p, name, words]) => {
      const list = items.filter(i => i.cur.lifecycle === "active" && i.cur.pillar === p && matches(i.id, i.cur.title, i.cur.statement));
      if (!list.length) return "";
      return `<section class="pillar"><h2>${name} <span class="muted">(${list.length})</span></h2><p>${words}</p><div class="cards">`
        + list.map(card).join("") + "</div></section>";
    }).join("")
    + (() => { const gone = items.filter(i => i.cur.lifecycle === "withdrawn" && matches(i.id, i.cur.title));
      return gone.length ? `<section class="pillar"><h2>Withdrawn</h2><div class="cards">${gone.map(card).join("")}</div></section>` : ""; })();
}
function card(i) {
  const n = decisions.filter(d => d.cur.lifecycle === "active" && curLinks(d).some(l => l.constraint_id === i.id)).length;
  return `<button class="card" data-go="#c/${i.id}"><span class="id">${i.id}</span>${esc(i.cur.title)}
    <div class="meta">${badge(i.cur.lifecycle === "withdrawn" ? "withdrawn" : i.cur.standing)}<span>${esc(groups[i.group_code].name)}</span>
    <span>v${i.cur.version}</span><span>${n} decision${n === 1 ? "" : "s"}</span></div></button>`;
}
function viewDecisions() {
  const rows = decisions.filter(d => matches(pad(d.number), d.cur.title, d.cur.summary, curLinks(d).map(l => l.constraint_id).join(" ")));
  return `<p class="lead">Each decision with the items it links: <span class="chip">serves</span> <span class="chip r-not-met">leaves unmet</span> <span class="chip r-exceeds">goes beyond (scope)</span>. <span class="flag">⚑</span> marks a decision whose items have changed since it was made, with no review.</p>
  <div class="table-wrap"><table><thead><tr><th>ADR</th><th>Decision</th><th>Links</th><th>Status</th><th>Version</th><th>Last change</th></tr></thead><tbody>`
    + rows.map(d => `<tr class="row" data-go="#d/${d.number}"><td>${pad(d.number)}</td><td>${esc(d.cur.title)}${needsReview[d.number] ? ' <span class="flag" title="needs review">⚑</span>' : ""}</td>
      <td>${curLinks(d).filter(l => l.relation !== "cites").map(l => chip(l.constraint_id, l.relation)).join("")}</td>
      <td>${d.cur.lifecycle === "withdrawn" ? badge("withdrawn") : esc(d.cur.status)}</td><td>${d.cur.version}</td><td class="muted">${day(d.cur.valid_from)}</td></tr>`).join("")
    + "</tbody></table></div>";
}
function events() {
  const ev = [];
  for (const i of items) for (const v of i.versions) {
    ev.push({when: v.valid_from, go: "#c/" + i.id, what: i.id, kind: v.version === 1 ? "added" : "changed", version: v.version, text: v.title, why: v.change_reason});
    if (v.lifecycle === "withdrawn") ev.push({when: v.valid_to, go: "#c/" + i.id, what: i.id, kind: "withdrawn", version: v.version, text: v.title, why: v.end_reason});
  }
  for (const d of decisions) for (const v of d.versions) {
    ev.push({when: v.valid_from, go: "#d/" + d.number, what: "ADR " + pad(d.number), kind: v.version === 1 ? "added" : "changed", version: v.version, text: v.title, why: v.change_reason});
    if (v.lifecycle === "withdrawn") ev.push({when: v.valid_to, go: "#d/" + d.number, what: "ADR " + pad(d.number), kind: "withdrawn", version: v.version, text: v.title, why: v.end_reason});
  }
  for (const r of DATA.reviews) ev.push({when: r.reviewed_at, go: "#d/" + r.number, what: "ADR " + pad(r.number), kind: "reviewed", version: "", text: `reviewed against ${r.constraint_id} v${r.constraint_version}`, why: r.note});
  return ev.filter(e => e.when).sort((a, b) => (b.when.localeCompare(a.when)) || a.what.localeCompare(b.what));
}
function viewTimeline() {
  const ev = events().filter(e => matches(e.what, e.text, e.why));
  return `<p class="lead">Every change to the records, newest first: when each item or decision was added, changed, reviewed or withdrawn, and why. A change displaces the version before it; nothing is overwritten.</p><ul class="timeline">`
    + ev.map(e => `<li data-go="${e.go}"><span class="when">${day(e.when)}</span><span><span class="what">${esc(e.what)}</span> <span class="ev-${e.kind}">${e.kind}${e.version ? " v" + e.version : ""}</span></span>
      <span>${esc(e.text)}<br><span class="muted">${esc(e.why || "")}</span></span></li>`).join("") + "</ul>";
}
function viewMatrix() {
  const active = decisions.filter(d => d.cur.lifecycle === "active");
  const list = items.filter(i => i.cur.lifecycle === "active" && matches(i.id, i.cur.title));
  const mark = {"serves": "●", "cites": "○", "not met": "✕", "exceeds": "▲"};
  return `<p class="legend">● serves &nbsp; ○ cites &nbsp; ✕ leaves unmet &nbsp; ▲ goes beyond (scope). Rows are items, columns are decisions; click a header or a cell.</p>
  <div class="table-wrap"><table class="matrix"><thead><tr><th></th>${active.map(d => `<th data-go="#d/${d.number}" title="${esc(d.cur.title)}">${d.number}</th>`).join("")}</tr></thead><tbody>`
    + list.map(i => `<tr><th class="row-h" data-go="#c/${i.id}" title="${esc(i.cur.title)}">${i.id} <span class="muted">${esc(i.cur.pillar)}</span></th>` + active.map(d => {
      const l = curLinks(d).find(l => l.constraint_id === i.id);
      return l ? `<td class="cell ${cls(l.relation)}" data-go="#d/${d.number}" title="ADR ${pad(d.number)} ${esc(RELATION_LABEL[l.relation])} ${i.id}">${mark[l.relation]}</td>` : "<td></td>";
    }).join("") + "</tr>").join("") + "</tbody></table></div>";
}
function viewBrief() {
  const sectionItems = h => items.filter(i => i.cur.lifecycle === "active" && i.cur.brief_section && i.cur.brief_section.toLowerCase() === h.toLowerCase());
  const added = items.filter(i => i.cur.lifecycle === "active" && !i.cur.brief_section);
  return `<p class="lead">The brief, verbatim, with the items drawn from each section. Below it, the items added since, which come from other sources.</p><div class="brief">`
    + DATA.brief.filter(s => matches(s.heading, s.text)).map(s => `<section><h2>${esc(s.heading)}</h2>${md(s.text)}<div>${sectionItems(s.heading).map(i => chip(i.id)).join("")}</div></section>`).join("")
    + `<section><h2>Added since the brief</h2>` + DATA.groups.map(g => {
        const list = added.filter(i => i.group_code === g.code);
        return list.length ? `<p><strong>${esc(g.name)}</strong><br>${list.map(i => chip(i.id) + " " + esc(i.cur.title)).join("<br>")}</p>` : "";
      }).join("") + "</section></div>";
}

// --- Detail panels ---------------------------------------------------------------------
let selectedVersion = null;
function versionButtons(versions, shown, go) {
  return `<div class="versions">` + versions.slice().reverse().map(v => `<button data-version="${v.version}" data-go="${go}" aria-pressed="${v.version === shown.version}">v${v.version} · ${day(v.valid_from)}${v.lifecycle === "active" ? " · active" : " · " + v.lifecycle}</button>`).join("") + "</div>";
}
function historyList(versions) {
  return "<ul>" + versions.slice().reverse().map(v => `<li><strong>v${v.version}</strong> ${day(v.valid_from)}${v.valid_to ? " to " + day(v.valid_to) : ", active"}: ${esc(v.change_reason)}${v.end_reason ? ` <span class="muted">(${esc(v.end_reason)})</span>` : ""} <span class="muted">· ${esc(v.changed_by)}</span></li>`).join("") + "</ul>";
}
function showItem(id) {
  const i = itemById[id];
  if (!i) return `<p>No item ${esc(id)}.</p>`;
  const v = i.versions.find(v => v.version === selectedVersion) || i.cur;
  const src = sources[v.source_id] || {title: v.source_id};
  const files = itemFiles.filter(f => f.constraint_id === id && f.version === v.version);
  const using = decisions.filter(d => d.cur.lifecycle === "active").flatMap(d => curLinks(d).filter(l => l.constraint_id === id).map(l => ({d, l})));
  const old = v !== i.cur ? `<div class="oldnote">Version ${v.version}, ${v.lifecycle}${v.valid_to ? " on " + day(v.valid_to) : ""}. The current version is ${i.cur.version}.</div>` : "";
  return `<h2>${id}. ${esc(v.title)}</h2><div>${badge(v.standing)} <span class="muted">${esc(v.pillar)} · ${esc(groups[i.group_code].name)}</span></div>
    ${versionButtons(i.versions, v, "#c/" + id)}${old}
    <blockquote>${inline(v.statement)}</blockquote>
    <p class="muted">Source: ${src.path ? `<a href="../../${esc(src.path)}">${esc(src.title)}</a>` : esc(src.title)}${v.brief_section ? ", " + esc(v.brief_section.toLowerCase()) : ""}${v.source_note ? ". " + inline(v.source_note) : ""}</p>
    <h3>What it means for the design</h3>${md(v.meaning)}
    <h3>Where the MVP stands</h3>${md(v.mvp)}
    ${files.length ? `<h3>Files</h3><ul>${files.map(f => `<li>${esc(f.role)}: <a href="../../${esc(f.path)}"><code>${esc(f.path)}</code></a></li>`).join("")}</ul>` : ""}
    <h3>Decisions</h3>${using.length ? "<ul>" + using.map(({d, l}) => `<li>${dchip(d.number)} ${esc(RELATION_LABEL[l.relation])} it${l.reason ? ": " + esc(l.reason) : ""}<br><span class="muted">${esc(d.cur.title)}; made under v${l.constraint_version}</span></li>`).join("") + "</ul>" : "<p class='muted'>None yet.</p>"}
    <h3>History</h3>${historyList(i.versions)}`;
}
function showDecision(n) {
  const d = decisionByNumber[n];
  if (!d) return `<p>No decision ${esc(n)}.</p>`;
  const v = d.versions.find(v => v.version === selectedVersion) || d.cur;
  const k = key(n, v.version);
  const ls = links[k] || [];
  const rel = relations[k] || [];
  const later = decisions.flatMap(o => (relations[key(o.number, o.cur.version)] || []).filter(r => r.other === n).map(r => ({o, r})));
  const review = needsReview[n] || [];
  const old = v !== d.cur ? `<div class="oldnote">Version ${v.version}, ${v.lifecycle}${v.valid_to ? " on " + day(v.valid_to) : ""}. The current version is ${d.cur.version}.</div>` : "";
  const group = rel => ls.filter(l => l.relation === rel);
  return `<h2>ADR ${pad(n)}. ${esc(v.title)}</h2><div class="muted">${esc(v.status)} · ${esc(v.date)} · <a href="../adr/${pad(n)}-${esc(slugs[n])}.md">page</a></div>
    ${versionButtons(d.versions, v, "#d/" + n)}${old}
    ${review.length ? `<p class="flag">Needs review: ${review.map(r => `${r.constraint_id} ${r.change} since v${r.made_under}`).join("; ")}.</p>` : ""}
    ${v.notes ? md(v.notes) : ""}
    ${["serves", "not met", "exceeds", "cites"].map(r => group(r).length ? `<h3>${RELATION_LABEL[r]}</h3><ul>${group(r).map(l => `<li>${chip(l.constraint_id, r)} ${esc(itemById[l.constraint_id]?.cur.title || "")}${l.reason ? ` <span class="muted">(${esc(l.reason)})</span>` : ""} <span class="muted">· v${l.constraint_version}</span></li>`).join("")}</ul>` : "").join("")}
    ${rel.length || later.length ? `<h3>Related decisions</h3><ul>${rel.map(r => `<li>${esc(r.kind)} ${dchip(r.other)}</li>`).join("")}${later.map(({o, r}) => `<li>${esc(PASSIVE[r.kind] || r.kind)} by ${dchip(o.number)}</li>`).join("")}</ul>` : ""}
    ${(sections[k] || []).map(s => `<h3>${esc(s.heading)}</h3>${md(s.body)}`).join("")}
    ${(dfiles[k] || []).length ? `<h3>Files</h3><ul>${dfiles[k].map(f => `<li>${esc(f.role)}: <a href="../../${esc(f.path)}"><code>${esc(f.path)}</code></a></li>`).join("")}</ul>` : ""}
    ${(reviews[n] || []).length ? `<h3>Reviews</h3><ul>${reviews[n].map(r => `<li>${day(r.reviewed_at)}: against ${chip(r.constraint_id)} v${r.constraint_version}. ${esc(r.note)}</li>`).join("")}</ul>` : ""}
    <h3>History</h3>${historyList(d.versions)}`;
}

// --- Routing ---------------------------------------------------------------------------
const VIEWS = {pillars: viewPillars, decisions: viewDecisions, timeline: viewTimeline, matrix: viewMatrix, brief: viewBrief};
let tab = "pillars";
function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  document.getElementById("view").innerHTML = VIEWS[tab]();
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const [kind, id] = h.split("/");
  const detail = document.getElementById("detail");
  if (VIEWS[kind]) { tab = kind; render(); }
  if (kind === "c" && id) detail.innerHTML = showItem(id.toUpperCase());
  else if (kind === "d" && id) detail.innerHTML = showDecision(Number(id));
  else return;
  detail.scrollTop = 0;
  document.querySelectorAll(".card, tr.row").forEach(el => el.classList.toggle("sel", el.dataset.go === "#" + h));
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go]");
  if (!t || e.target.closest("a")) return;
  selectedVersion = t.dataset.version ? Number(t.dataset.version) : null;
  if (location.hash === t.dataset.go) route(); else location.hash = t.dataset.go;
});
document.getElementById("tabs").addEventListener("click", e => {
  if (e.target.dataset.tab) { tab = e.target.dataset.tab; render(); }
});
document.getElementById("q").addEventListener("input", render);
window.addEventListener("hashchange", route);

const active = items.filter(i => i.cur.lifecycle === "active");
const count = p => active.filter(i => i.cur.pillar === p).length;
const scopeShort = active.filter(i => i.cur.pillar === "scope" && i.cur.standing === "not met").length;
const changes = events().length;
document.getElementById("stats").innerHTML = [
  [count("intent"), "intent"], [count("constraint"), "constraints"], [count("scope"), "scope"],
  [decisions.filter(d => d.cur.lifecycle === "active").length, "decisions"], [changes, "changes recorded"],
  [Object.keys(needsReview).length, "need review", Object.keys(needsReview).length > 0],
  [scopeShort, "scope items not met", scopeShort > 0],
].map(([n, label, warn]) => `<span class="stat${warn ? " warn" : ""}"><b>${n}</b>${label}</span>`).join("");
const last = events()[0];
document.getElementById("foot").textContent = last ? `Last change: ${day(last.when)}, ${last.what}. ${DATA.item_versions.length} item versions, ${DATA.decision_versions.length} decision versions.` : "";
render();
route();
</script>
</body>
