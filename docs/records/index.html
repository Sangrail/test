ser does not need to open the PDF (U5).\n- A PDF with some text does not mean that all its pages, tables or images are searchable. A scanned page gives no text.\n- The 10-second target (U3) is measured on the test corpus only. It is not a promise for any file or any computer.","heading":"Consequences","number":1,"position":3,"version":3},{"body":"Done, and extended. The [indexing package](../../engineering_search/indexing/) detects the type from the content ([ADR 0003](0003-versioned-reader-selection.md)) and has readers for Markdown (text and pipe tables) and PDF (text layer, page by page with pypdf, at most 15 lines in each passage). [ADR 0016](0016-structured-facts-and-client-written-sql.md) adds CSV and XLSX readers for structured data. No OCR, no Word, no CAD content: scans and CAD files are listed in the coverage report as gaps. A file that cannot be read is skipped and reported ([ADR 0005](0005-coverage-and-reader-gaps.md)). Uploads accept Markdown only. Tests: `tests/test_indexer.py`, `tests/test_coverage.py`, `tests/test_index.py`, `tests/test_use_case.py`.","heading":"Implementation","number":1,"position":4,"version":3},{"body":"The MVP must be easy for other people to download, run and test (S1). The repository will be published (S3), so it must not need a central account, a hosted service or private data. In production the files stay in the existing repository (C2). For the MVP, a local folder stands in for it.","heading":"Context","number":2,"position":1,"version":1},{"body":"- Each person runs an independent copy of the service on a computer that they control: indexing, search, telemetry and audit.\n- The document folder and the writable state folder are separate from the code. Both can be set at start.\n- Remote use is a copy on a remote machine, reached through an SSH tunnel to a loopback port.\n- The source package contains the code and the synthetic and public test documents only. It never contains private documents, uploads or audit databases.","heading":"Decision","number":2,"position":2,"version":1},{"body":"- No account, API key or cloud database is needed. The install needs network access, and search does not.\n- Pretend sign-in is acceptable only for trusted testers. Anyone who can reach the service can select any user ([ADR 0008](0008-index-team-and-audit-viewer.md)).\n- The documents are on the tester's computer, so the access rules are a demonstration, not a protection ([ADR 0012](0012-mcp-server-for-the-chat-agent.md)).\n- One local instance is not a service for an organisation. Serving any number of users, each within 10 seconds, with no single point of failure (P1), is separate engineering work ([ADR 0018](0018-admission-control-and-the-time-budget.md), [docs/README.md](../README.md#making-it-available-to-an-organisation)).\n- A future reader must declare its dependencies, platforms and licence. A vendor reader on the developer's computer does not mean that a tester can install it.","heading":"Consequences","number":2,"position":3,"version":1},{"body":"Done. `python -m engineering_search` starts the web service. [`runtime.py`](../../engineering_search/runtime.py) puts the index, queue and audit files in the state folder (default `.runtime/`). The index persists between runs ([ADR 0004](0004-persistent-evidence.md)). Telemetry resets on restart. `scripts/package_source.py` makes the source ZIP. See [RUNNING.md](../../RUNNING.md).","heading":"Implementation","number":2,"position":4,"version":1},{"body":"The MVP must be easy for other people to download, run and test (S1). The repository will be published (S3), so it must not need a central account, a hosted service or private data. In production the files stay in the existing repository (C2). For the MVP, a local folder stands in for it.","heading":"Context","number":2,"position":1,"version":2},{"body":"- Each person runs an independent copy of the service on a computer that they control: indexing, search, telemetry and audit.\n- The document folder and the writable state folder are separate from the code. Both can be set at start.\n- Remote use is a copy on a remote machine, reached through an SSH tunnel to a loopback port.\n- The source package contains the code and the synthetic and public test documents only. It never contains private documents, uploads or audit databases.","heading":"Decision","number":2,"position":2,"version":2},{"body":"- No account, API key or cloud database is needed. The install needs network access, and search does not.\n- Pretend sign-in is acceptable only for trusted testers. Anyone who can reach the service can select any user ([ADR 0008](0008-index-team-and-audit-viewer.md)).\n- The documents are on the tester's computer, so the access rules are a demonstration, not a protection ([ADR 0012](0012-mcp-server-for-the-chat-agent.md)).\n- One local instance is not a service for an organisation. Serving any number of users, each within 10 seconds, with no single point of failure (P1), is separate engineering work ([ADR 0018](0018-admission-control-and-the-time-budget.md), [docs/README.md](../README.md#making-it-available-to-an-organisation)).\n- A future reader must declare its dependencies, platforms and licence. A vendor reader on the developer's computer does not mean that a tester can install it.","heading":"Consequences","number":2,"position":3,"version":2},{"body":"Done. `python -m engineering_search` starts the web service. [`runtime.py`](../../engineering_search/runtime.py) puts the index, queue and audit files in the state folder (default `.runtime/`). The index persists between runs ([ADR 0004](0004-persistent-evidence.md)). Telemetry resets on restart. `scripts/package_source.py` makes the source ZIP. See [RUNNING.md](../../RUNNING.md).","heading":"Implementation","number":2,"position":4,"version":2},{"body":"The repository holds years of files (C2). One format can have many versions, and an old version can need a different reader. The brief says that connectors and APIs extract from *supported* files (C3), so the system must know which files are supported. To have confidence in the source (U4), the system must also know how each file was read: a new reader can read the same file differently.","heading":"Context","number":3,"position":1,"version":1},{"body":"- Detect the format and version of each file from its content. The file extension and the file date are hints only.\n- A registry maps each format and version to a tested reader, with its exact version, its capabilities and the test files that prove it.\n- The selection is deterministic. A missing runtime, a missing licence, an unsupported version or an unclear result gives an explicit outcome, never a silent fallback to another reader.\n- For each source version, record the detected format and version, the selected reader and its version, and the result of the extraction.\n- Never change a reader silently. A new reader gives a new extraction revision, after tests.","heading":"Decision","number":3,"position":2,"version":1},{"body":"- A file that no reader can read becomes visible work, not a hidden gap ([ADR 0005](0005-coverage-and-reader-gaps.md)).\n- The repository profile decides which readers come first ([design/DATA-PROFILE.md](../../design/DATA-PROFILE.md)). A viewer that reads the same formats is selected at the same time.\n- Normal search reads stored passages and does not open the file again ([ADR 0004](0004-persistent-evidence.md)).","heading":"Consequences","number":3,"position":3,"version":1},{"body":"Mostly done. [`indexing/detect.py`](../../engineering_search/indexing/detect.py): `ContentDetector` treats the extension as a hint and checks the first 512 bytes. A PDF header gives the PDF version, a ZIP with `xl/workbook.xml` is XLSX, and a JT file's 80-character header gives its version (for example JT 10.0). Content that contradicts the extension is `FORMAT_MISMATCH` and is not given to a reader. [`readers/registry.py`](../../engineering_search/indexing/readers/registry.py): `ReaderRegistry` holds several readers for each type, each with a manifest (name, version, formats, format versions, dependencies, capabilities). It picks the first installed reader that supports the format version, and tells `NO_READER`, `UNSUPPORTED_VERSION` and `DEPENDENCY_MISSING` apart. The detector and the registry are injected into `Indexer`. The reader and its version are stored for each file, and a new reader version re-extracts the file. Tests: `tests/test_coverage.py`, `tests/test_indexer.py`.\n\nNot done: detection for formats without a signature (Markdown and CSV are named by extension), and any JT or CATIA reader. The JT probe reads the version string only. CAD stays out of scope ([ADR 0001](0001-mvp-format-scope.md)).","heading":"Implementation","number":3,"position":4,"version":1},{"body":"The repository holds years of files (C2). One format can have many versions, and an old version can need a different reader. The brief says that connectors and APIs extract from *supported* files (C3), so the system must know which files are supported. To have confidence in the source (U4), the system must also know how each file was read: a new reader can read the same file differently.","heading":"Context","number":3,"position":1,"version":2},{"body":"- Detect the format and version of each file from its content. The file extension and the file date are hints only.\n- A registry maps each format and version to a tested reader, with its exact version, its capabilities and the test files that prove it.\n- The selection is deterministic. A missing runtime, a missing licence, an unsupported version or an unclear result gives an explicit outcome, never a silent fallback to another reader.\n- For each source version, record the detected format and version, the selected reader and its version, and the result of the extraction.\n- Never change a reader silently. A new reader gives a new extraction revision, after tests.","heading":"Decision","number":3,"position":2,"version":2},{"body":"- A file that no reader can read becomes visible work, not a hidden gap ([ADR 0005](0005-coverage-and-reader-gaps.md)).\n- The repository profile decides which readers come first ([design/DATA-PROFILE.md](../../design/DATA-PROFILE.md)). A viewer that reads the same formats is selected at the same time.\n- Normal search reads stored passages and does not open the file again ([ADR 0004](0004-persistent-evidence.md)).","heading":"Consequences","number":3,"position":3,"version":2},{"body":"Mostly done. [`indexing/detect.py`](../../engineering_search/indexing/detect.py): `ContentDetector` treats the extension as a hint and checks the first 512 bytes. A PDF header gives the PDF version, a ZIP with `xl/workbook.xml` is XLSX, and a JT file's 80-character header gives its version (for example JT 10.0). Content that contradicts the extension is `FORMAT_MISMATCH` and is not given to a reader. [`readers/registry.py`](../../engineering_search/indexing/readers/registry.py): `ReaderRegistry` holds several readers for each type, each with a manifest (name, version, formats, format versions, dependencies, capabilities). It picks the first installed reader that supports the format version, and tells `NO_READER`, `UNSUPPORTED_VERSION` and `DEPENDENCY_MISSING` apart. The detector and the registry are injected into `Indexer`. The reader and its version are stored for each file, and a new reader version re-extracts the file. Tests: `tests/test_coverage.py`, `tests/test_indexer.py`.\n\nNot done: detection for formats without a signature (Markdown and CSV are named by extension), and any JT or CATIA reader. The JT probe reads the version string only. CAD stays out of scope ([ADR 0001](0001-mvp-format-scope.md)).","heading":"Implementation","number":3,"position":4,"version":2},{"body":"The repository holds years of files (C2). One format can have many versions, and an old version can need a different reader. The brief says that connectors and APIs extract from *supported* files (C3), so the system must know which files are supported. To have confidence in the source (U4), the system must also know how each file was read: a new reader can read the same file differently.","heading":"Context","number":3,"position":1,"version":3},{"body":"- Detect the format and version of each file from its content. The file extension and the file date are hints only.\n- A registry maps each format and version to a tested reader, with its exact version, its capabilities and the test files that prove it.\n- The selection is deterministic. A missing runtime, a missing licence, an unsupported version or an unclear result gives an explicit outcome, never a silent fallback to another reader.\n- For each source version, record the detected format and version, the selected reader and its version, and the result of the extraction.\n- Never change a reader silently. A new reader gives a new extraction revision, after tests.","heading":"Decision","number":3,"position":2,"version":3},{"body":"- A file that no reader can read becomes visible work, not a hidden gap ([ADR 0005](0005-coverage-and-reader-gaps.md)).\n- The repository profile decides which readers come first ([design/DATA-PROFILE.md](../../design/DATA-PROFILE.md)). A viewer that reads the same formats is selected at the same time.\n- Normal search reads stored passages and does not open the file again ([ADR 0004](0004-persistent-evidence.md)).","heading":"Consequences","number":3,"position":3,"version":3},{"body":"Mostly done. [`indexing/detect.py`](../../engineering_search/indexing/detect.py): `ContentDetector` treats the extension as a hint and checks the first 512 bytes. A PDF header gives the PDF version, a ZIP with `xl/workbook.xml` is XLSX, and a JT file's 80-character header gives its version (for example JT 10.0). Content that contradicts the extension is `FORMAT_MISMATCH` and is not given to a reader. [`readers/registry.py`](../../engineering_search/indexing/readers/registry.py): `ReaderRegistry` holds several readers for each type, each with a manifest (name, version, formats, format versions, dependencies, capabilities). It picks the first installed reader that supports the format version, and tells `NO_READER`, `UNSUPPORTED_VERSION` and `DEPENDENCY_MISSING` apart. The detector and the registry are injected into `Indexer`. The reader and its version are stored for each file, and a new reader version re-extracts the file. Tests: `tests/test_coverage.py`, `tests/test_indexer.py`.\n\nNot done: detection for formats without a signature (Markdown and CSV are named by extension), and any JT or CATIA reader. The JT probe reads the version string only. CAD stays out of scope ([ADR 0001](0001-mvp-format-scope.md)).","heading":"Implementation","number":3,"position":4,"version":3},{"body":"To answer in under 10 seconds (U3) across many documents, search cannot open every file for each question. To give 100% confidence in the source (U4), each answer must point to an exact, fixed version of the file. The user must not need to open the file to check it (U5).","heading":"Context","number":4,"position":1,"version":1},{"body":"- Extract each file once, and store its passages with the file, the location (lines, and the page for a PDF) and the SHA-256 of the file content.\n- Search reads only the stored passages.\n- Apply a change to a document as one transaction. A failed update must not leave part of a document in the index.\n- Keep three versions separate: the source version (content hash), the format version, and the reader version ([ADR 0003](0003-versioned-reader-selection.md)). A new reader can change the passages of a file whose hash did not change.\n- Deleted files leave the index. Permissions apply to all stored passages, every time ([ADR 0006](0006-permissions-before-results.md)).","heading":"Decision","number":4,"position":2,"version":1},{"body":"- Each answer has a file, page, line range and SHA-256 version. A test can check it against the file itself.\n- The index survives a restart. A restart reads and hashes every file, and extracts only new and changed files.\n- Until the reader version is recorded, a reader change cannot be traced in the stored passages.","heading":"Consequences","number":4,"position":3,"version":1},{"body":"Done. [`store.py`](../../engineering_search/store.py): `SQLiteSearchIndex` keeps `documents` (file and SHA-256), `passages` (text, heading, lines, page), the FTS5 index, `files` (type, format version, reader and reader version, status, warnings) and, for tables, `source_tables`, `table_rows` and `facts` ([ADR 0016](0016-structured-facts-and-client-written-sql.md)), in `index-<id>.sqlite3` ([ADR 0009](0009-sqlite-fts5-index-and-answers.md)). `apply` and `upsert` write a document, its tables, facts and file record in one transaction. A new reader version re-extracts the file. Tests: `tests/test_index.py` (persistence and one transaction), `tests/test_coverage.py` (statuses survive a restart), `tests/test_use_case.py` (each answer checked against the file).","heading":"Implementation","number":4,"position":4,"version":1},{"body":"If a search finds nothing, the user must not think that no document states the value when the true reason is that a file could not be read. That would break confidence in the answer (U4). The repository holds years of files (C2), and connectors read only supported files (C3), so some files will not be readable. A 20-year-old drawing is a question of compatibility. Its age does not prove that it is supported or obsolete.","heading":"Context","number":5,"position":1,"version":1},{"body":"- Keep an inventory of all discovered files, with a clear outcome for each: out of scope, unsupported format, unknown version, reader not available, encrypted, damaged, extraction failed, partly extracted, no text, or indexed.\n- Discovery and eligibility are separate. List an out-of-scope CAD file without reading it.\n- One bad file must not stop the index build.\n- Group the report by format, version and reason, with counts, for the index team. Never show an unreadable file as a search result with zero matches. Never show its name to a user who cannot read it ([ADR 0006](0006-permissions-before-results.md)).\n- Coverage figures must keep unreadable and unsupported files in the total.","heading":"Decision","number":5,"position":2,"version":1},{"body":"- The team can see which reader to build or buy next, and test it on real old files.\n- An unsupported version needs a new reader, not endless retries.","heading":"Consequences","number":5,"position":3,"version":1},{"body":"Done. [`indexing/status.py`](../../engineering_search/indexing/status.py) names one status for each file: classification (`CLASSIFIED`, `UNSUPPORTED_FORMAT`, `NO_READER`, `UNSUPPORTED_VERSION`, `DEPENDENCY_MISSING`, `FORMAT_MISMATCH`, `INVALID_HEADER`, `READ_ERROR`) and reading (`INDEXED_FULL`, `INDEXED_PARTIAL`, `NO_TEXT_LAYER`, `NO_EXTRACTABLE_CONTENT`, `MALFORMED`, `ENCRYPTED`, `READER_CRASH`), each with a hint. A PDF without a text layer is `NO_TEXT_LAYER`, not indexed. The inventory is stored in the index (`files` table) with the format version, the reader and the warnings, and survives a restart. [`indexing/coverage.py`](../../engineering_search/indexing/coverage.py) builds the report by type, format version, status, folder and capability. The index team gets it at `GET /index/coverage` and through the MCP tool `get_index_coverage`. Other users do not, because the report names files. Tests: `tests/test_coverage.py`, `tests/test_indexer.py`, `tests/test_startup.py`.","heading":"Implementation","number":5,"position":4,"version":1},{"body":"If a search finds nothing, the user must not think that no document states the value when the true reason is that a file could not be read. That would break confidence in the answer (U4). The repository holds years of files (C2), and connectors read only supported files (C3), so some files will not be readable. A 20-year-old drawing is a question of compatibility. Its age does not prove that it is supported or obsolete.","heading":"Context","number":5,"position":1,"version":2},{"body":"- Keep an inventory of all discovered files, with a clear outcome for each: out of scope, unsupported format, unknown version, reader not available, encrypted, damaged, extraction failed, partly extracted, no text, or indexed.\n- Discovery and eligibility are separate. List an out-of-scope CAD file without reading it.\n- One bad file must not stop the index build.\n- Group the report by format, version and reason, with counts, for the index team. Never show an unreadable file as a search result with zero matches. Never show its name to a user who cannot read it ([ADR 0006](0006-permissions-before-results.md)).\n- Coverage figures must keep unreadable and unsupported files in the total.","heading":"Decision","number":5,"position":2,"version":2},{"body":"- The team can see which reader to build or buy next, and test it on real old files.\n- An unsupported version needs a new reader, not endless retries.","heading":"Consequences","number":5,"position":3,"version":2},{"body":"Done. [`indexing/status.py`](../../engineering_search/indexing/status.py) names one status for each file: classification (`CLASSIFIED`, `UNSUPPORTED_FORMAT`, `NO_READER`, `UNSUPPORTED_VERSION`, `DEPENDENCY_MISSING`, `FORMAT_MISMATCH`, `INVALID_HEADER`, `READ_ERROR`) and reading (`INDEXED_FULL`, `INDEXED_PARTIAL`, `NO_TEXT_LAYER`, `NO_EXTRACTABLE_CONTENT`, `MALFORMED`, `ENCRYPTED`, `READER_CRASH`), each with a hint. A PDF without a text layer is `NO_TEXT_LAYER`, not indexed. The inventory is stored in the index (`files` table) with the format version, the reader and the warnings, and survives a restart. [`indexing/coverage.py`](../../engineering_search/indexing/coverage.py) builds the report by type, format version, status, folder and capability. The index team gets it at `GET /index/coverage` and through the MCP tool `get_index_coverage`. Other users do not, because the report names files. Tests: `tests/test_coverage.py`, `tests/test_indexer.py`, `tests/test_startup.py`.","heading":"Implementation","number":5,"position":4,"version":2},{"body":"The use case is for selected users (U1), and documents in the repository have different readers. A user must never get information from a document that the user cannot read (R1). Information is more than text: a count, a file name, an empty result position or a page total can also show that a forbidden document matches. If the service picks a page of results first and removes forbidden passages after, the counts and the gaps leak information, and permitted results can be lost.","heading":"Context","number":6,"position":1,"version":1},{"body":"- After the index lookup and before anything else, decide which matched files the user can read. Everything after that step uses permitted files only: the answer, the \"also stated in\" list, the document list, the counts, the pages and the file overview.\n- Check permissions again on every request, including each page. A page number is not permission to read.\n- Reading one file gives the same reply for \"does not exist\" and \"not permitted\", so file names do not leak.\n- If the permission check fails, return no evidence (fail closed).\n- A search match that is excluded by permissions is recorded in the audit log. It is a different event from a deliberate attempt to open a forbidden file.","heading":"Decision","number":6,"position":2,"version":1},{"body":"- Counts and pages are correct for each user and show nothing about forbidden files.\n- Pages are live views. If the index or the permissions change between two pages, results can move. The service never freezes permissions to keep pages stable.\n- Two exceptions are recorded in [`access.py`](../../engineering_search/access.py): the sign-in screen shows folder counts for each demo user (no names, no text), and the audit log shows file names to the index team ([ADR 0008](0008-index-team-and-audit-viewer.md)).","heading":"Consequences","number":6,"position":3,"version":1},{"body":"Done. `SearchService.search` and `SearchService.read` in [`service.py`](../../engineering_search/service.py). The service finds the matching files, evaluates permissions on them, and gives the index lookup the set of permitted files (and `within`). The lookup ([`store.py`](../../engineering_search/store.py)) applies that set inside the FTS5 query, before the 1,000-candidate limit, so forbidden passages cannot push permitted ones out. The SQL path builds a projection of permitted files only ([ADR 0016](0016-structured-facts-and-client-written-sql.md)). `POST /search` takes `page` and `limit` (at most 50). Tests: `tests/test_no_leaks.py` asks every evaluation question, and questions made from the text of each forbidden file, in each mode, for each user, and checks the first five pages and the last page. Also `test_forbidden_passages_cannot_push_a_permitted_passage_past_the_candidate_limit` in `tests/test_binding.py`, `tests/test_sql.py`, `tests/test_access.py`, `tests/test_pagination.py` and `tests/test_use_case.py`.","heading":"Implementation","number":6,"position":4,"version":1},{"body":"The use case sets a time limit (U3), so the time of each stage must be measured from the first version. It also asks for 100% confidence in the source (U4) and strict permissions (R1). The company must be able to show, after the event, which evidence each user got and which matches were withheld. Telemetry (performance) and audit (security) have different purposes and must stay separate.","heading":"Context","number":7,"position":1,"version":1},{"body":"- Measure indexing throughput, query times (median, p95 and others), failures and the time of each search stage: lookup, permissions and audit.\n- Before the service returns evidence, write an audit event: the user, the permission version, the decision for each matched file, the source of the answer and of each returned passage. If the write fails, return no evidence.\n- Do not record the question text, the passage text or credentials. Record the number of characters in the question only.\n- Take the user from the session, never from the question.\n- A later event records that the response was sent. It cannot prove that a person read it.","heading":"Decision","number":7,"position":2,"version":1},{"body":"- The audit log shows that permitted evidence reached the user and that excluded matches did not.\n- The audit log is a local SQLite file, with no protection against changes and no retention rules. A production audit must be durable and protected (P4).\n- File names in the audit log are sensitive. Only the index team can read the log ([ADR 0008](0008-index-team-and-audit-viewer.md)).\n- Fast searches alone do not prove a useful or complete index. Coverage ([ADR 0005](0005-coverage-and-reader-gaps.md)) and quality ([ADR 0015](0015-acceptance-tests-enforce-the-use-case.md)) are separate measures.","heading":"Consequences","number":7,"position":3,"version":1},{"body":"Done. `SearchService.commit_audit` in [`service.py`](../../engineering_search/service.py) writes to `audit.sqlite3` ([`adapters.py`](../../engineering_search/adapters.py)) and raises `ServiceError(503)` on failure. `Telemetry` keeps the last 10,000 queries and 100 index runs in memory, so it resets on restart. The audit log is durable but not protected against changes, and has no retention rules. Tests: `tests/test_audit.py`.","heading":"Implementation","number":7,"position":4,"version":1},{"body":"The use case is for engineering managers and leads who search (U1). Index operations, uploads, telemetry, the access rules and the audit log are a different job, with sensitive information: the audit log names files that some users cannot read. Permission to search must not give access to these operations (R1).","heading":"Context","number":8,"position":1,"version":1},{"body":"- JP and Kamal can search only.\n- Maya represents the index team. Maya can open index operations, uploads, telemetry, the access rules, the API documentation and the audit log.\n- The index-team role does not change file permissions. When Maya searches, Maya gets only the files that Maya can read ([ADR 0010](0010-path-based-access-rules.md)).\n- The server checks the role on every page and API request. Hidden navigation is not the protection.\n- The audit viewer shows pages of events, newest first. A snapshot ID keeps the pages stable while new events arrive. It is a page boundary, not permission to read.","heading":"Decision","number":8,"position":2,"version":1},{"body":"- A search user cannot see the access rules, the audit log or other users' searches.\n- The index team can see file names in permission decisions. That is accepted for this role.\n- Sign-in is pretend, so anyone can select Maya. Real identity is required before a shared service ([TODO.md](../../TODO.md#before-use-as-a-shared-service)).","heading":"Consequences","number":8,"position":3,"version":1},{"body":"Done. The `backend_boundary` middleware in [`app.py`](../../engineering_search/app.py) protects `/admin`, `/index`, `/scan`, `/uploads`, `/audit`, `/telemetry`, `/health` and the API pages. A denied request is recorded in the audit log. Pages: `static/admin.html` and `static/audit.html`. The demo users are `USERS` in [`access.py`](../../engineering_search/access.py). Tests: `tests/test_access.py`, `tests/test_audit.py`.\n\nThe earlier version of this record described per-file grants for ten demonstration files. [ADR 0010](0010-path-based-access-rules.md) replaced those grants with folder and file rules.","heading":"Implementation","number":8,"position":4,"version":1},{"body":"The first prototype kept passages in memory and needed every question word to match exactly. Plain-language questions (U6) found nothing for 76% of the test questions. Search across 100+ documents in under 10 seconds (U2, U3) needs an index, not a scan of the passages, as dtSearch and Lucene do. The first prototype also returned passages. The user asked for an answer (R2), and for lists of documents (R3). Confidence in the source (U4) means that the service must not write or change the answer text.","heading":"Context","number":9,"position":1,"version":1},{"body":"1. Store documents and passages in SQLite, with an FTS5 inverted index over the heading, the text and the words of the file path. Use the `porter unicode61` tokenizer, so \"loads\" matches \"load\".\n2. Change each question into an index query: remove common words, add a small synonym list, and make words with digits into prefix searches (\"S355\" finds \"S355J2+N\"). Show the user what was searched for.\n3. Match any word. Rank passages that contain more of the question words first, then by BM25 (heading 3, text 1, file path 0.5).\n4. Answer with text copied from a passage: one sentence or table row for a value question, or one line for each document in a list question. Never write or change the answer text.\n5. For list questions, find the documents that contain every question word. Apply number comparisons (\"greater than 5 kN/m²\") at query time, with unit conversion.\n6. Update the index incrementally by SHA-256, in one transaction ([ADR 0004](0004-persistent-evidence.md)).","heading":"Decision","number":9,"position":2,"version":1},{"body":"- A question takes about 16 ms on the 138 test files, far below the 10-second limit.\n- Each answer has a file, page, line range and version. Tests check it against the file.\n- This is a basic method. It finds words, not meanings. It does not know which element a value belongs to, and number filters see only what word search finds. [ADR 0014](0014-defer-facts-store-and-embeddings.md) records why facts and embeddings are deferred.\n- At a larger scale, the same design moves to OpenSearch or Elasticsearch ([design/SCALING.md](../../design/SCALING.md)).","heading":"Consequences","number":9,"position":3,"version":1},{"body":"Done. [`store.py`](../../engineering_search/store.py) (index, up to 1,000 candidates from permitted files), [`query.py`](../../engineering_search/query.py) (query plan), [`answer.py`](../../engineering_search/answer.py) (answer and list), [`units.py`](../../engineering_search/units.py) (quantities, with sign, in SI units). A list comparison counts a quantity only in a sentence bound to the question words. A list is paged at 200 documents, with the total count. Measured by `scripts/evaluate.py`. Enforced by `tests/test_use_case.py`, `tests/test_index.py` and `tests/test_binding.py`.\n\nLimits: the incremental update reads and hashes every file; only extraction is incremental. Filters over tables now use SQL ([ADR 0016](0016-structured-facts-and-client-written-sql.md)); the text path stays for values in prose.","heading":"Implementation","number":9,"position":4,"version":1},{"body":"The first prototype gave per-file grants to ten demonstration files, and gave all other files to two users only. That made most of the repository look out of scope, and it did not match how the existing repository (C2) controls access. File shares and document systems set permissions on folders, and files inherit them, as in Windows. The search must cover all 100+ documents (U2) and still never give a user information from a document that the user cannot read (R1).","heading":"Context","number":10,"position":1,"version":1},{"body":"- Index every supported file. Permissions decide what a user sees, not what is indexed.\n- A rule applies to the whole repository, to a folder or to one file. The most specific rule wins and replaces the inherited one.\n- Rules list users directly. There are no groups and no \"deny\" entries.\n- Check the rules on each request, before answers, counts and pages ([ADR 0006](0006-permissions-before-results.md)).\n\nThe full list of assumptions is at the top of [`access.py`](../../engineering_search/access.py).","heading":"Decision","number":10,"position":2,"version":1},{"body":"- The rules are simpler than Windows (NTFS) permissions, which merge inherited and explicit entries and have \"deny\" entries. A production service must get the effective permissions from the repository through its connector, not copy them into a Python file (P3).\n- The rules are small and easy to read for a demonstration. The sign-in screen and the README show which folders each user can read.","heading":"Consequences","number":10,"position":3,"version":1},{"body":"Done. `ACCESS_RULES`, `governing_rule` and `MockPermissionStore` in [`access.py`](../../engineering_search/access.py). JP reads 138 of 138 files, Kamal 130 and Maya 133. Tests: `tests/test_access.py`, `tests/test_pagination.py`, `tests/test_no_leaks.py` (which also checks each user's file list against a list written by hand).","heading":"Implementation","number":10,"position":4,"version":1},{"body":"The first prototype gave per-file grants to ten demonstration files, and gave all other files to two users only. That made most of the repository look out of scope, and it did not match how the existing repository (C2) controls access. File shares and document systems set permissions on folders, and files inherit them, as in Windows. The search must cover all 100+ documents (U2) and still never give a user information from a document that the user cannot read (R1).","heading":"Context","number":10,"position":1,"version":2},{"body":"- Index every supported file. Permissions decide what a user sees, not what is indexed.\n- A rule applies to the whole repository, to a folder or to one file. The most specific rule wins and replaces the inherited one.\n- Rules list users directly. There are no groups and no \"deny\" entries.\n- Check the rules on each request, before answers, counts and pages ([ADR 0006](0006-permissions-before-results.md)).\n\nThe full list of assumptions is at the top of [`access.py`](../../engineering_search/access.py).","heading":"Decision","number":10,"position":2,"version":2},{"body":"- The rules are simpler than Windows (NTFS) permissions, which merge inherited and explicit entries and have \"deny\" entries. A production service must get the effective permissions from the repository through its connector, not copy them into a Python file (P3).\n- The rules are small and easy to read for a demonstration. The sign-in screen and the README show which folders each user can read.","heading":"Consequences","number":10,"position":3,"version":2},{"body":"Done. `ACCESS_RULES`, `governing_rule` and `MockPermissionStore` in [`access.py`](../../engineering_search/access.py). JP reads 138 of 138 files, Kamal 130 and Maya 133. Tests: `tests/test_access.py`, `tests/test_pagination.py`, `tests/test_no_leaks.py` (which also checks each user's file list against a list written by hand).","heading":"Implementation","number":10,"position":4,"version":2},{"body":"The use case has two front ends: a search bar on a web page, and a chat-agent shell that calls backend APIs and tools (C5). The broader architecture already exists (C1), so this component must be a backend that other parts call, not a closed application. Before this decision, the search, permission and audit logic was in the HTTP routes of `app.py`. The MCP server had to call the web app over HTTP, or copy the logic. A copy can drift: one front end could check permissions (R1) or audit the sources (U4) differently from the other.","heading":"Context","number":11,"position":1,"version":1},{"body":"- [`service.py`](../../engineering_search/service.py) holds all search logic in `SearchService`: search, read one file, permissions, audit, index operations and uploads.\n- [`app.py`](../../engineering_search/app.py) is the HTTP layer only. It does sign-in, roles, request checks and the routes. Each route calls the service. The upload routes are an MVP shortcut: they call `service.queue` directly for the job steps.\n- [`mcp_server.py`](../../engineering_search/mcp_server.py) calls the same service directly, with the same index, permissions and audit log. It does not start the web app.\n- The service raises `ServiceError(status, detail)`. The web app changes it into an HTTP reply. The MCP server returns it as an error result.\n- Every import points down: entry points (`__main__.py`, `mcp_server.py`) → [`runtime.py`](../../engineering_search/runtime.py) → `app.py` → `service.py` → the indexer (`indexing/`), domain logic (`answer.py`, `access.py`) and adapters (`store.py`, `adapters.py`, `jobs.py`) → `core.py` and `query.py`. `service.py` does not import `store.py`. `runtime.py` opens the stores and gives them to the service as objects. [design/code-architecture.png](../../design/code-architecture.png) shows each import.","heading":"Decision","number":11,"position":2,"version":1},{"body":"- Both front ends give the same answer, check the same permissions and write the same audit events. One test of the service covers both.\n- A new front end (for example a REST client in the existing architecture, C1) needs only a thin layer.\n- Each process has its own `SearchService`: the web app in one process, the MCP server in another. Both open the same SQLite files. SQLite allows this, but a shared service needs one backend that many clients call ([design/SCALING.md](../../design/SCALING.md)).\n- `SearchService` is a large class. It is acceptable for the MVP. The MVP shortcuts are listed in [ARCHITECTURE.md](../../ARCHITECTURE.md).","heading":"Consequences","number":11,"position":3,"version":1},{"body":"Done. Tests go through the web app (`tests/test_*.py`) and through the service directly (`tests/test_no_leaks.py` calls `service.read`). `scripts/check_mcp.py` starts the MCP server as a chat client does and calls its tools.","heading":"Implementation","number":11,"position":4,"version":1},{"body":"The constraints include a chat-agent shell that can call backend APIs and tools (C5). The users do not want to learn file formats, schema, query languages or jargon (U6). A chat agent lets them ask in their own words, and lets the agent ask follow-up questions. The Model Context Protocol (MCP) is the standard way for chat clients (Claude Desktop, Claude Code and others) to call tools. The simplest MCP transport is stdio: the chat client starts the server as a local process. A stdio server has no sign-in. It knows the user only from its start command. R1 is an absolute requirement, so this is a security hole.","heading":"Context","number":12,"position":1,"version":1},{"body":"- Provide an MCP server with two tools:\n  - `search_evidence(question, mode, within, limit, page)`: the same search as the search bar.\n  - `read_evidence(file_id, page)`: all indexed passages of one readable file.\n- Use the stdio transport for the MVP (S1).\n- Take the user from the `--user` flag (or `SEARCH_USER`). Nothing verifies it.\n- Accept this hole for the MVP only, with public and synthetic test data only (S3). Record it in the module docstring, [docs/MCP.md](../MCP.md), the README and the system design diagram.\n- The tool results contain the same permitted evidence as the web page. The agent must quote the answer and its source, not write its own value (U4).","heading":"Decision","number":12,"position":2,"version":1},{"body":"- A person who can change the chat client configuration can read as any user. Do not use the stdio server with real restricted files.\n- The fix: run the MCP server remotely over Streamable HTTP, behind the company sign-in (OAuth). Take the user from the verified token on each request. The permissions and audit log then match the real person ([docs/MCP.md](../MCP.md#the-security-hole-the-mcp-user-is-not-verified)).\n- Tool results go to the language-model provider of the chat client. The company must approve that provider for the documents.\n- The agent can summarise or change the exact text. The tool gives exact text and sources, but the agent's reply is outside the control of this service.","heading":"Consequences","number":12,"position":3,"version":1},{"body":"Done for stdio, with the hole. [`mcp_server.py`](../../engineering_search/mcp_server.py), with `mcp==1.27.2` (FastMCP). [ADR 0016](0016-structured-facts-and-client-written-sql.md) adds the structured tools: `describe_schema`, `list_tables`, `describe_table`, `query_sql` and `get_document_evidence`. The index team also gets `get_index_coverage`. Verified on 29 October 2026 with Claude Code, Codex and Pi over local stdio; the project files `.mcp.json` and `.pi/mcp.json` start the server. Install and test steps: [docs/MCP.md](../MCP.md). Checks: `uv run --frozen python -m scripts.check_mcp` and `tests/test_mcp_stdio.py`, which run the server as a chat client does. The remote server with OAuth is in [TODO.md](../../TODO.md#before-use-as-a-shared-service).","heading":"Implementation","number":12,"position":4,"version":1},{"body":"The user asks for one parameter (U1) and must trust the source 100% (U4). The user also asked for an answer, not a list of passages (R2). Word search always finds something: a question about a project that does not exist still matches \"roof\" and \"load\" in other projects. If the service always gives its best match as the answer, a user can get the load limit of the wrong project, with a correct-looking source. That is worse than no answer. Two documents can also state different values for the same parameter, for example a draft and an approved revision.","heading":"Context","number":13,"position":1,"version":1},{"body":"- Each answer has a status:\n  - `found`: one sentence or table row states a value, and its document contains every question word.\n  - `partial`: the closest sentence states a value, but its document does not contain some question words. `missing_words` names them. The user sees which words were not found, for example the project name.\n  - `not_found`: no sentence states a value that matches enough question words (`MIN_COVERAGE`, 50%). The service gives no answer.\n- Check the question words against the whole document text, not only the passage. A project name is often in the title, not in the sentence with the value.\n- Copy the answer exactly from the document. Never write, round or convert the answer text.\n- Show other readable files that also state a value as \"also stated in\", so the user sees conflicts (at most `MAX_ALSO_STATED`, 5).\n- Use only readable files for each of these steps (R1, [ADR 0006](0006-permissions-before-results.md)).","heading":"Decision","number":13,"position":2,"version":1},{"body":"- The service can say \"not found\" when a person would find the value in a table or a drawing that the readers cannot read. A correct \"not found\" is better than a wrong answer.\n- `partial` is a word check, not an understanding of the question. It does not know that the value belongs to the asked element. [ADR 0014](0014-defer-facts-store-and-embeddings.md) records the facts store that would know this.\n- The test questions include a question with no answer, and the acceptance tests check that the service gives none.","heading":"Consequences","number":13,"position":3,"version":1},{"body":"Done for the known case. `pick_answer()` in [`answer.py`](../../engineering_search/answer.py) checks that the cited sentence is bound to the question words: through the sentence, its heading, the file path or the document title. If the document has every word but the sentence does not name some of them, the status is `unverified`, with `unbound_words`. \"Roof load is not specified. Floor load limit is 5 kN/m².\" no longer answers \"What is the roof load?\" as `found`. The web page and the MCP server show the status and the missing or unbound words. Tests: `tests/test_binding.py`, `test_no_answer_is_given_when_no_document_states_it` and `test_one_value_is_answered_from_its_exact_source` in `tests/test_use_case.py`, and the `answer_correct` metric of `scripts/evaluate.py`.\n\nLimits: binding is a word check. A sentence that names the subject can still state a different parameter. The document-title rule is a heuristic: the first passage counts as the title only if it starts in the first three lines.","heading":"Implementation","number":13,"position":4,"version":1},{"body":"The constraints offer connectors that extract properties (C3), and structured and semantic stores (C4). A structured store of engineering facts (element, parameter, value, unit, status, source) would answer \"the roof load limit at Northgate\" directly. Embeddings in a semantic store would find passages that use different words from the question. Both need decisions that the MVP cannot make yet:\n\n- Which questions do users ask? Which parameters (U1) and which words?\n- Which document types hold the answers, and in which form: sentences, tables, title blocks or drawings?\n- Which readers and extractors can get the values reliably, with their source?\n\nThere is no one design that suits all repositories. A facts store made without this research extracts the wrong properties. Embeddings without tests can rank a similar but wrong passage first, which breaks U4.","heading":"Context","number":14,"position":1,"version":1},{"body":"- For the MVP (S1), use word search and exact text answers only ([ADR 0009](0009-sqlite-fts5-index-and-answers.md)).\n- Do not build a facts store or embeddings yet.\n- First, profile the repository and collect real questions and answers ([design/DATA-PROFILE.md](../../design/DATA-PROFILE.md)). Then design the extractors and stores from those questions ([design/EXTRACTION.md](../../design/EXTRACTION.md)).\n- Keep the index schema and the source fields (file, page, lines, version) so that a later facts store or embedding index can cite the same sources.","heading":"Decision","number":14,"position":2,"version":1},{"body":"- The MVP finds words, not meanings. Synonyms are a small fixed list. The metrics on the test data are high because the questions, the synonyms and the documents were made together ([docs/METRICS.md](../METRICS.md)).\n- Hybrid search (words and embeddings) and the facts store are phase 2 and 3 work ([TODO.md](../../TODO.md#next-phase-2)).\n- The question set and the acceptance tests ([ADR 0015](0015-acceptance-tests-enforce-the-use-case.md)) will measure whether the later stores are better.","heading":"Consequences","number":14,"position":3,"version":1},{"body":"Superseded in part by [ADR 0016](0016-structured-facts-and-client-written-sql.md): typed facts from tables are implemented, and the MCP client writes constrained SQL over them. Still deferred: facts from prose, and embeddings. The design is in [design/EXTRACTION.md](../../design/EXTRACTION.md) and [design/DATA-PROFILE.md](../../design/DATA-PROFILE.md).","heading":"Implementation","number":14,"position":4,"version":1},{"body":"The use case must be enforced by tests (R4), not only described. The repository will be published, so the test data must be public or synthetic (S3). Real engineering documents cannot be used. The tests need more than 100 documents (U2), questions with known answers and sources (U1, U4), and documents that some users cannot read (R1).","heading":"Context","number":15,"position":1,"version":1},{"body":"- Keep a test repository in `test-repository/` with 138 files: 133 Markdown and 5 PDF.\n  - 120 generated project files in `generated-projects/`, so the count is above 100 (U2).\n  - Hand-written projects (Northgate, Riverside, Cedar), registers and specifications, with known values, conflicts, drafts and approvals.\n  - Two public FHWA steel bridge handbook PDFs. `SOURCES.txt` records where they come from.\n- Write one acceptance test for each part of the use case in `tests/test_use_case.py`:\n  - more than 100 documents (U2);\n  - one value from its exact file, page, lines and version, checked against the file (U1, U4, U5);\n  - no answer when no document states it ([ADR 0013](0013-no-answer-before-a-wrong-answer.md));\n  - list questions, material, approval status, load comparison and a follow-up (R3);\n  - each answer within the 10-second limit (U3);\n  - no answer from a file the user cannot read (R1).\n- Test R1 more strongly in `tests/test_no_leaks.py`: every question, plus questions made from the text of each forbidden file, in each mode, on the first five result pages of 50 passages, for each user.\n- Measure ranking and answers with `scripts/evaluate.py` on 17 questions, 16 of them scored (`evaluation/questions.json`). Save the results in `evaluation/results/answers.json`.","heading":"Decision","number":15,"position":2,"version":1},{"body":"- A change that breaks the use case on these examples fails a test. The tests do not cover every failure: they passed with defects that a later review found, a wrong parameter marked `found` and lost results when forbidden passages filled the retrieval limit, which [ADR 0017](0017-bind-answers-and-permit-before-the-limit.md) fixed with new tests. The open limits are in [TODO.md](../../TODO.md#known-limits-fix-or-decide).\n- The test data was made with the questions and the synonyms. The scores are higher than on a real repository. [docs/METRICS.md](../METRICS.md) and [evaluation/README.md](../../evaluation/README.md) explain the limits and the gaps in the tests.\n- The tests prove the behaviour on this repository, not on the company's repository. A real question set, made from real users and real documents, is the next step ([ADR 0014](0014-defer-facts-store-and-embeddings.md)).","heading":"Consequences","number":15,"position":3,"version":1},{"body":"Done. Run `uv run --frozen pytest -q` and `uv run --frozen python -m scripts.evaluate`. The current figures are in [docs/METRICS.md](../METRICS.md).","heading":"Implementation","number":15,"position":4,"version":1},{"body":"The text path ([ADR 0009](0009-sqlite-fts5-index-and-answers.md)) answers one value from prose well enough. It answers filter questions badly: \"Which S355 components have an allowable load under 5 kN/m²?\" needs every matching row, a numeric comparison in one unit, and the difference between what a component can carry (a capacity) and what it must carry (a demand). Word search sees only the passages that it ranks, so the list is not complete, and a number near a keyword can belong to a different element.\n\nMuch of the data that leads ask about is already structured: component schedules and registers in CSV and Excel, and tables in Markdown and PDF. The 29 October design inputs ([handoff](../CODEX_ENGINEERING_SEARCH_HANDOFF.md), [design notes](../engineering_knowledge_search_design_notes.html)) ask for these tables to keep their row identity and source location, and for the MCP client's LLM to plan structured questions. They rule out a second LLM on the server.\n\nThe premise is that the indexer is designed from the questions and the data: to build it, you need an idea of the questions; to answer them, you need to know what data you have and what you can extract from it. That gives two kinds of extracted data, unstructured (passages) and structured (tables and facts), and a way in for each.\n\nWho writes the structured query has three options:\n\n1. **The service plans it from the plain-language question.** No LLM, but a rule-based planner for joins and filters is a query language in disguise, and it is brittle.\n2. **A server-side LLM writes SQL.** Needs an API key and a provider on the server, and sends questions to it. The design inputs rule it out.\n3. **The chat agent that already reads the question writes SQL, and the server constrains it.** The LLM is already in the loop (C5). The user still asks in plain language (U6). The server owns safety and permissions.","heading":"Context","number":16,"position":1,"version":1},{"body":"- **Extract tables and typed facts at index time.** Readers return tables with the source line, page or sheet of each row: Markdown pipe tables, CSV files and XLSX sheets. Fixed rules (`indexing/facts.py`) read the column header, the table name and the cell, and give each cell a parameter, a role (capacity, demand, specification, status, measurement, unknown), the value as written, a number, a unit and an SI value. Facts come only from table cells, never from free text. Capacity and demand are never the same parameter.\n- **Publish a small, documented schema** to the client: `documents`, `facts`, `components` (a view with the common parameters as columns), `table_rows` and `source_tables`. `describe_schema`, `list_tables` and `describe_table` describe it. The schema holds no document data.\n- **The MCP client's LLM writes the SQL.** `query_sql` runs one statement. The service does not plan structured questions itself, and the web search bar does not claim to.\n- **Constrain the SQL on the server, for each request:**\n  - Build an in-memory SQLite projection with only the rows from files the user may read, and every dependent row. Forbidden data is absent, not filtered, so counts, joins and `NOT EXISTS` cannot reveal it. The base index is never exposed to SQL.\n  - Accept one `SELECT` or `WITH` statement, at most 4000 characters.\n  - Run it with `PRAGMA query_only`, an authoriser that allows reads of the published tables only and a short function allowlist, a budget of 2,000,000 SQLite steps, and at most 500 rows.\n  - Audit the SHA-256 and length of the statement, the files in scope and excluded, the row count and the cited files, not the rows.\n- **Every row can be cited.** Rows carry `file_id`, `table_no`, `row_no`, `line` and `page`. `get_document_evidence` returns the row's cells, its facts, the file's SHA-256 version and the verbatim line.\n- **Keep the text path.** `search_evidence` and `read_evidence` are unchanged. The server instructions tell the agent to choose: SQL for filters, joins and counts over tables; text search for values in prose.","heading":"Decision","number":16,"position":2,"version":1},{"body":"- \"S355 components under 5 kN/m²\" returns every matching row from the files the user may read, with citations: 7 rows for JP, 6 for Kamal. Verified with Claude Code, Codex and Pi ([docs/MCP.md](../MCP.md#what-was-verified)).\n- The server makes the SQL safe; it does not make it right. The LLM can write a valid query for the wrong thing. The column names (`allowable_load_kn_m2`, `imposed_load_kn_m2`) and the instructions guide it, and the tool call shows the SQL to the tester.\n- A value stated only in prose is not a fact. SQL does not find it; text search does.\n- The rules know a small set of parameters and units. A new kind of column becomes a fact with role `unknown` until a rule is added.\n- The web page has no structured path. `POST /sql` exists in the HTTP API for a future client-planned flow.\n- Building a projection per request is simple and safe, and costs time in proportion to the permitted data. It does not scale to a large repository; a policy-enforced view over the base index is the later design ([design/SCALING.md](../../design/SCALING.md)).\n- The safety rests on SQLite's authoriser and `query_only`, not on a SQL parser. The bypass tests in `tests/test_sql.py` are the check. The MCP tool does not take bound parameters yet.","heading":"Consequences","number":16,"position":3,"version":1},{"body":"Done for CSV, XLSX and Markdown tables. Readers: [`readers/csv.py`](../../engineering_search/indexing/readers/csv.py), [`readers/xlsx.py`](../../engineering_search/indexing/readers/xlsx.py) (`openpyxl`; a formula with no cached value is left empty and the file is `INDEXED_PARTIAL`), [`readers/markdown.py`](../../engineering_search/indexing/readers/markdown.py). Facts: [`indexing/facts.py`](../../engineering_search/indexing/facts.py), units in [`units.py`](../../engineering_search/units.py). Store: `source_tables`, `table_rows` and `facts` in [`store.py`](../../engineering_search/store.py). Projection and safety: [`sql.py`](../../engineering_search/sql.py). Service: `query_sql`, `sql_schema`, `table_row_evidence` in [`service.py`](../../engineering_search/service.py). HTTP: `POST /sql`, `GET /sql/schema`, `GET /e
