n":null,"lifecycle":"active","meaning":"Search must work across every file the user may read without the user naming one, and each answer must say where it came from (U2, U4).","mvp":"Each question searches every permitted file, and each answer names its file, location and version.","pillar":"intent","source_id":"brief","source_note":null,"standing":"context","statement":"Users often do not know which files contain the information they need.","title":"Users do not know which files hold the answer","valid_from":"2026-10-29T12:12:14Z","valid_to":null,"version":1},{"brief_section":"Constraints","change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"C1","end_reason":"Displaced by version 2","lifecycle":"displaced","meaning":"This component must be a backend that other parts can call, not a separate product with its own front end only.","mvp":"One search service behind both the web app and the MCP server. The wider architecture is not known in detail.","pillar":"constraint","source_id":"brief","source_note":null,"standing":"partly met","statement":"A broader architecture direction already exists.","title":"A broader architecture direction already exists","valid_from":"2026-10-28T20:27:45Z","valid_to":"2026-10-29T12:12:14Z","version":1},{"brief_section":"Constraints","change_reason":"ADR 0020: the environment in the brief is assumed to exist; the MVP's readers, folder, stores and chat clients are stand-ins for it.","changed_by":"sangrail","constraint_id":"C1","end_reason":null,"lifecycle":"active","meaning":"This component is a backend that other parts of that architecture call, not a separate product.","mvp":"One search service behind an HTTP API, a web page and an MCP server stands in for this component's place in that architecture. The wider architecture is not known in detail.","pillar":"constraint","source_id":"brief","source_note":null,"standing":"assumed","statement":"A broader architecture direction already exists.","title":"A broader architecture direction already exists","valid_from":"2026-10-29T12:12:14Z","valid_to":null,"version":2},{"brief_section":"Constraints","change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"C2","end_reason":"Displaced by version 2","lifecycle":"displaced","meaning":"The system does not own the files. A real repository holds years of files in many formats and versions, with its own permissions. The format boundary must stay open for later readers.","mvp":"A local folder stands in for the repository. Files are read in place and never changed. Permissions are a Python dictionary, not the repository's own.","pillar":"constraint","source_id":"brief","source_note":null,"standing":"partly met","statement":"The files live in an existing repository.","title":"The files live in an existing repository","valid_from":"2026-10-28T20:27:45Z","valid_to":"2026-10-29T12:12:14Z","version":1},{"brief_section":"Constraints","change_reason":"ADR 0020: the environment in the brief is assumed to exist; the MVP's readers, folder, stores and chat clients are stand-ins for it.","changed_by":"sangrail","constraint_id":"C2","end_reason":null,"lifecycle":"active","meaning":"The system does not own the files. A real repository holds years of files in many formats and versions, with its own permissions. The service reads what is there and never changes it.","mvp":"A local folder of test files stands in for the repository, and folder rules in `access.py` stand in for its permissions. Files are read in place and never changed. Real permissions are P3.","pillar":"constraint","source_id":"brief","source_note":null,"standing":"assumed","statement":"The files live in an existing repository.","title":"The files live in an existing repository","valid_from":"2026-10-29T12:12:14Z","valid_to":null,"version":2},{"brief_section":"Constraints","change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"C3","end_reason":"Displaced by version 2","lifecycle":"displaced","meaning":"Only *supported* files can be read, so the system must know which files are supported, which are not, and why.","mvp":"The MVP has its own readers (Markdown, PDF text layer, CSV, XLSX) and reports every file it cannot read. No connector is used yet.","pillar":"constraint","source_id":"brief","source_note":null,"standing":"partly met","statement":"Connectors and APIs can extract metadata, text and properties from supported files.","title":"Connectors extract metadata, text and properties","valid_from":"2026-10-28T20:27:45Z","valid_to":"2026-10-29T12:12:14Z","version":1},{"brief_section":"Constraints","change_reason":"ADR 0020: the environment in the brief is assumed to exist; the MVP's readers, folder, stores and chat clients are stand-ins for it.","changed_by":"sangrail","constraint_id":"C3","end_reason":null,"lifecycle":"active","meaning":"The connectors exist and are not part of this work. The service consumes what they extract (text, tables and properties, with source locations and versions), and it must know which files were read, by which connector and version, and which were not.","mvp":"The MVP's readers for Markdown, PDF text layer, CSV and XLSX are placeholders for the connectors, written only to prove the chain from file to cited answer. They are not a proposal to build extraction. Each sits behind the reader interface (`ReaderManifest`, `Extraction`), which is where a connector adapter plugs in ([ADR 0020](../adr/0020-assume-the-environment-and-stand-in-for-it.md)). Every file that no reader handles is reported.","pillar":"constraint","source_id":"brief","source_note":null,"standing":"assumed","statement":"Connectors and APIs can extract metadata, text and properties from supported files.","title":"Connectors extract metadata, text and properties","valid_from":"2026-10-29T12:12:14Z","valid_to":null,"version":2},{"brief_section":"Constraints","change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"C4","end_reason":"Displaced by version 2","lifecycle":"displaced","meaning":"The stores should be chosen from the questions and the data, and both kinds may be needed.","mvp":"A keyword index (FTS5) for text, and tables and typed facts for structured questions. No semantic (embedding) store: it is deferred until the questions show a gain.","pillar":"constraint","source_id":"brief","source_note":null,"standing":"partly met","statement":"Extracted information can be stored in structured and/or semantic stores.","title":"Structured and/or semantic stores","valid_from":"2026-10-28T20:27:45Z","valid_to":"2026-10-29T12:12:14Z","version":1},{"brief_section":"Constraints","change_reason":"ADR 0020: the environment in the brief is assumed to exist; the MVP's readers, folder, stores and chat clients are stand-ins for it.","changed_by":"sangrail","constraint_id":"C4","end_reason":null,"lifecycle":"active","meaning":"The stores should be chosen from the questions and the data, and both kinds may be needed.","mvp":"SQLite stands in for the stores: an FTS5 keyword index for passages, and tables and typed facts for structured questions. No semantic (embedding) store: it is deferred until the questions show a gain.","pillar":"constraint","source_id":"brief","source_note":null,"standing":"assumed","statement":"Extracted information can be stored in structured and/or semantic stores.","title":"Structured and/or semantic stores","valid_from":"2026-10-29T12:12:14Z","valid_to":null,"version":2},{"brief_section":"Constraints","change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"C5","end_reason":"Displaced by version 2","lifecycle":"displaced","meaning":"The service exposes tools that a chat agent can call. The agent's language model is part of the system and must be measured.","mvp":"An MCP server over local stdio, used from Claude Code, Codex and Pi. The agent writes the SQL for table questions.","pillar":"constraint","source_id":"brief","source_note":null,"standing":"partly met","statement":"A chat-agent shell can call backend APIs or tools to expose a conversational plane for users.","title":"A chat-agent shell calls backend APIs or tools","valid_from":"2026-10-28T20:27:45Z","valid_to":"2026-10-29T12:12:14Z","version":1},{"brief_section":"Constraints","change_reason":"ADR 0020: the environment in the brief is assumed to exist; the MVP's readers, folder, stores and chat clients are stand-ins for it.","changed_by":"sangrail","constraint_id":"C5","end_reason":null,"lifecycle":"active","meaning":"The service exposes tools that a chat agent can call. The agent's language model is part of the system and must be measured.","mvp":"Claude Code, Codex and Pi over a local MCP server stand in for the company's chat-agent shell. The agent writes the SQL for table questions.","pillar":"constraint","source_id":"brief","source_note":null,"standing":"assumed","statement":"A chat-agent shell can call backend APIs or tools to expose a conversational plane for users.","title":"A chat-agent shell calls backend APIs or tools","valid_from":"2026-10-29T12:12:14Z","valid_to":null,"version":2},{"brief_section":null,"change_reason":"Recorded as a production requirement that the MVP does not meet.","changed_by":"sangrail","constraint_id":"P1","end_reason":null,"lifecycle":"active","meaning":"No single process, lock, connection or machine on the query path. Reads scale out; writes do not block reads; the store is replicated and fails over; capacity is planned and load-tested.","mvp":"**Not met.** One process, one lock, one SQLite connection, about 10 requests a second, on one machine. Admission control refuses the excess at once rather than answering late. See [ADR 0018](../adr/0018-admission-control-and-the-time-budget.md).","pillar":"constraint","source_id":"production","source_note":"Follows from U3 at organisational scale","standing":"not met","statement":"An arbitrary number of people can ask at the same time, and each gets an answer within 10 seconds. The service stays available when a process, a machine or a zone fails.","title":"Any number of users, each answered within 10 seconds","valid_from":"2026-10-29T11:52:41Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"Recorded as a production requirement that the MVP does not meet.","changed_by":"sangrail","constraint_id":"P2","end_reason":null,"lifecycle":"active","meaning":"Company sign-in for the web app; a remote MCP server with OAuth, taking the user from the verified token.","mvp":"**Not met.** Pretend sign-in on the web; the MCP server trusts `--user`. This is a known security hole ([ADR 0012](../adr/0012-mcp-server-for-the-chat-agent.md)).","pillar":"constraint","source_id":"production","source_note":"Follows from R1","standing":"not met","statement":"The service knows who is asking from the company identity provider. It never takes the user from a flag, a setting or a tool argument.","title":"Verified identity","valid_from":"2026-10-29T11:52:41Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"Recorded as a production requirement that the MVP does not meet.","changed_by":"sangrail","constraint_id":"P3","end_reason":null,"lifecycle":"active","meaning":"Effective permissions (including inheritance and deny entries) synced or queried through the connector.","mvp":"**Not met.** Path rules in `access.py` ([ADR 0010](../adr/0010-path-based-access-rules.md)).","pillar":"constraint","source_id":"production","source_note":"Follows from R1 and C2","standing":"not met","statement":"Each user's file permissions come from the repository itself, current at query time.","title":"Permissions from the repository","valid_from":"2026-10-29T11:52:41Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"Recorded as a production requirement that the MVP does not meet.","changed_by":"sangrail","constraint_id":"P4","end_reason":null,"lifecycle":"active","meaning":"A managed audit store with retention, tamper evidence and access control.","mvp":"**Not met.** A local SQLite file ([ADR 0007](../adr/0007-telemetry-and-audit.md)).","pillar":"constraint","source_id":"production","source_note":"Follows from U4 and R1","standing":"not met","statement":"The audit log survives the loss of a machine, is protected against change, and has retention and backup rules.","title":"Durable, protected audit","valid_from":"2026-10-29T11:52:41Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"Recorded as a production requirement that the MVP does not meet.","changed_by":"sangrail","constraint_id":"P5","end_reason":null,"lifecycle":"active","meaning":"A data-governance decision per repository or classification, enforced by the service.","mvp":"**Not met.** The chat client sends permitted tool results to its provider ([ADR 0012](../adr/0012-mcp-server-for-the-chat-agent.md)).","pillar":"constraint","source_id":"production","source_note":"Follows from C5","standing":"not met","statement":"The company approves which document text may be sent to which language model provider.","title":"Approved use of language models","valid_from":"2026-10-29T11:52:41Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"Recorded as a production requirement that the MVP does not meet.","changed_by":"sangrail","constraint_id":"P6","end_reason":null,"lifecycle":"active","meaning":"Profile the real repository; collect real questions with expected answers and sources; score retrieval, SQL and replies.","mvp":"**Not met.** Scores come from synthetic data written with the questions ([ADR 0019](../adr/0019-evaluate-retrieval-and-nl-to-sql.md)).","pillar":"constraint","source_id":"production","source_note":"Follows from U4 and R4","standing":"not met","statement":"Answer quality is measured on real questions from engineering leads, with a held-back set, and releases are gated on it.","title":"Quality measured on real questions","valid_from":"2026-10-29T11:52:41Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"R1","end_reason":null,"lifecycle":"active","meaning":"Information is more than text: a count, a file name, a ranking or a join can leak too. Permissions apply before any limit, ranking, count, join or aggregate.","mvp":"Met in the tests on both paths. It rests on pretend sign-in and an unverified MCP user, so it is a demonstration until P2 and P3 are met.","pillar":"constraint","source_id":"mvp","source_note":null,"standing":"partly met","statement":"A user must never get information from a document that the user is not authorised to read. This is an absolute requirement.","title":"No information from a forbidden document","valid_from":"2026-10-28T20:27:45Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"R2","end_reason":null,"lifecycle":"active","meaning":"Select one value with its source, or say clearly that no readable document states it.","mvp":"One sentence or row with a status (found, unverified, partial, not found), or rows from SQL.","pillar":"intent","source_id":"mvp","source_note":null,"standing":"met","statement":"The service must answer the question. A list of passages is not an answer.","title":"An answer, not a list of passages","valid_from":"2026-10-28T20:27:45Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"R3","end_reason":null,"lifecycle":"active","meaning":"Lists must be complete within the user's permissions, paged, and filterable by value with units.","mvp":"Text lists with bound number comparisons and paging; complete filters over tables through SQL.","pillar":"intent","source_id":"mvp","source_note":null,"standing":"met","statement":"Users can ask for lists of documents: by project, topic, material, approval status, or a value such as a load above 5 kN/m², with follow-up questions about a previous list.","title":"Lists of documents, with follow-ups","valid_from":"2026-10-28T20:27:45Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"R4","end_reason":null,"lifecycle":"active","meaning":"Each part of the use case has a test that fails when it breaks. Quality is measured by evaluation, not by eye.","mvp":"Acceptance tests, a leak test, SQL and binding tests, a retrieval evaluation and an NL-to-SQL gold set. The live-client SQL evaluation is not built.","pillar":"constraint","source_id":"mvp","source_note":null,"standing":"partly met","statement":"The tests must enforce the use case.","title":"The tests enforce the use case","valid_from":"2026-10-28T20:27:45Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"Added by the product owner: response time is a constraint, not only a use-case wish.","changed_by":"sangrail (via Claude Code)","constraint_id":"R5","end_reason":null,"lifecycle":"active","meaning":"Search must not scan files per question: an index, built ahead of the question, and a time budget per request.","mvp":"About 80 ms median per question on 148 files in one process; under load, admission control answers within 8 s or refuses at once (ADR 0018). Not measured on hundreds of real files.","pillar":"constraint","source_id":"owner","source_note":null,"standing":"met","statement":"The response time must be under 10 seconds when the repository holds hundreds of files.","title":"Answers in under 10 seconds across hundreds of files","valid_from":"2026-10-29T12:26:33Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"Added by the product owner: concurrent use is a constraint.","changed_by":"sangrail (via Claude Code)","constraint_id":"R6","end_reason":null,"lifecycle":"active","meaning":"Requests from different users must not block each other indefinitely, and each must be answered within the time limit or told when to retry.","mvp":"One process answers about 10 requests a second, one at a time. Admission control answers each request within 8 s or refuses it at once with a retry time. Serving any number of users is P1, and a distributed system is out of scope (S6).","pillar":"constraint","source_id":"owner","source_note":null,"standing":"partly met","statement":"The system must allow several users to use it at the same time.","title":"Several users at the same time","valid_from":"2026-10-29T12:26:33Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"Added by the product owner: where the data lives is a real constraint.","changed_by":"sangrail (via Claude Code)","constraint_id":"R7","end_reason":null,"lifecycle":"active","meaning":"Files are found by walking folders; a file is identified by its path; the folder is the natural unit of permission and of project.","mvp":"The test repository is a folder per project, file IDs are paths, and access rules apply to folders and their files (ADR 0010). A local folder stands in for the real file system (C2).","pillar":"constraint","source_id":"owner","source_note":null,"standing":"met","statement":"The data lives on a file system, and projects are organised in folders.","title":"Project data lives on a file system, in project folders","valid_from":"2026-10-29T12:26:33Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"Added by the product owner: folder authorisation is a real constraint.","changed_by":"sangrail (via Claude Code)","constraint_id":"R8","end_reason":null,"lifecycle":"active","meaning":"Every result, count, list and join is limited to the folders the user may read, before any limit or ranking (with R1). The user must be known (P2), and the permissions must be the file system's own (P3).","mvp":"Folder rules in access.py are applied before search, counts, SQL and evidence, and the tests prove no leak. They stand in for the file system's permissions, and the user is not verified.","pillar":"constraint","source_id":"owner","source_note":null,"standing":"partly met","statement":"Users are not permitted to see within folders that they are not authorised to see, so the system needs authorisation.","title":"Users cannot see inside folders they are not authorised for","valid_from":"2026-10-29T12:26:33Z","valid_to":null,"version":1},{"brief_section":"Scope","change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"S1","end_reason":null,"lifecycle":"active","meaning":"Take shortcuts where they do not hide a risk, and write each one down. Prove the path from question to cited answer before building the platform.","mvp":"Built in about four to five hours. The shortcuts are listed in [ARCHITECTURE.md](../../ARCHITECTURE.md#mvp-shortcuts-in-the-code) and the production gaps in [production.md](production.md).","pillar":"scope","source_id":"brief","source_note":null,"standing":"met","statement":"The initial scope is an MVP, not the final platform or solution.","title":"An MVP, not the final platform","valid_from":"2026-10-28T20:27:45Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"S2","end_reason":"Displaced by version 2","lifecycle":"displaced","meaning":"A small, honest format set, with every other file reported, not hidden.","mvp":"Met, and extended by S4 with CSV and XLSX. CAD stays out of scope.","pillar":"scope","source_id":"mvp","source_note":"Set at the start; extended by S4","standing":"partly met","statement":"The first formats are Markdown and PDF with a text layer. No OCR. No DXF, DWG, JT or CATIA.","title":"Markdown and simple PDF, no OCR, no CAD","valid_from":"2026-10-28T20:27:45Z","valid_to":"2026-10-29T12:12:14Z","version":1},{"brief_section":null,"change_reason":"ADR 0020: the first formats are those of the stand-in readers; more formats are the connectors' job.","changed_by":"sangrail","constraint_id":"S2","end_reason":null,"lifecycle":"active","meaning":"A small format set is enough to prove the chain. Reading more formats is the connectors' job (C3). Every other file is reported, not hidden.","mvp":"Met, and extended by S4 with CSV and XLSX. CAD stays out of scope.","pillar":"scope","source_id":"mvp","source_note":"Set at the start; extended by S4","standing":"met","statement":"The first formats for the stand-in readers are Markdown and PDF with a text layer. No OCR. No DXF, DWG, JT or CATIA.","title":"Markdown and simple PDF, no OCR, no CAD","valid_from":"2026-10-29T12:12:14Z","valid_to":null,"version":2},{"brief_section":null,"change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"S3","end_reason":null,"lifecycle":"active","meaning":"No real engineering documents. Scores on the test data are therefore optimistic.","mvp":"Synthetic Markdown, PDF, CSV and XLSX files, and two public FHWA PDFs.","pillar":"scope","source_id":"mvp","source_note":null,"standing":"met","statement":"The repository will be published, so the test documents must be synthetic or publicly shareable.","title":"Synthetic or public test documents","valid_from":"2026-10-28T20:27:45Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"Recorded from the 29 October design inputs.","changed_by":"sangrail","constraint_id":"S4","end_reason":null,"lifecycle":"active","meaning":"The MCP client's language model plans structured questions; the server constrains and runs them. No second language model on the server.","mvp":"Built: CSV and XLSX readers, content detection, reader registry, coverage report, constrained SQL and the structured MCP tools.","pillar":"scope","source_id":"inputs","source_note":"With the [design notes](../../docs/engineering_knowledge_search_design_notes.html); dated inputs, not edited","standing":"met","statement":"Add CSV and XLSX, detection of the file type from content, a coverage report, and SQL written by the MCP client over tables. CAD content stays out of scope.","title":"The 29 October design inputs","valid_from":"2026-10-29T00:00:00Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"Added by the product owner: the readers go beyond the scope, because the brief says connectors exist.","changed_by":"sangrail (via Claude Code)","constraint_id":"S5","end_reason":null,"lifecycle":"active","meaning":"Effort goes into what sits between the connectors and the answer. Readers beyond what the chain needs go past this scope.","mvp":"Exceeded, knowingly: the MVP has its own readers for Markdown, PDF text, CSV and XLSX, and its own rules that turn table cells into typed facts, to show the system partly working. They simulate connectors that are believed to exist (ADR 0020).","pillar":"scope","source_id":"owner","source_note":null,"standing":"exceeded","statement":"The MVP does not build extraction: connectors already extract metadata, text and properties (C3). Stand-ins may show the chain working.","title":"Extraction is the connectors' job","valid_from":"2026-10-29T12:26:33Z","valid_to":null,"version":1},{"brief_section":null,"change_reason":"Added by the product owner: scope says how far down the road the MVP goes, and it stops short of a distributed system.","changed_by":"sangrail (via Claude Code)","constraint_id":"S6","end_reason":null,"lifecycle":"active","meaning":"Several users are served by one process within the time budget, or told to retry. Scaling out, replication and failover are beyond this scope even though the intent (U3) and the constraints (R6) point there; P1 records that.","mvp":"One process with admission control (ADR 0018). The work needed to serve the organisation is documented, not built.","pillar":"scope","source_id":"owner","source_note":null,"standing":"met","statement":"The MVP is not a distributed system: one machine, one service process (and one MCP process per chat client).","title":"Not a distributed system","valid_from":"2026-10-29T12:26:33Z","valid_to":null,"version":1},{"brief_section":"Task","change_reason":"Recorded from the task of the brief.","changed_by":"sangrail","constraint_id":"T1","end_reason":null,"lifecycle":"active","meaning":"Write the requirements down where decisions can cite them, and keep the gaps visible.","mvp":"The requirements are these constraint pages; the gaps are the production requirements (P1–P6) and [TODO.md](../../TODO.md).","pillar":"scope","source_id":"brief","source_note":null,"standing":"met","statement":"Identify and clarify the requirements, and any critical gaps or challenges (5 minutes).","title":"Identify and clarify the requirements, gaps and challenges","valid_from":"2026-10-29T12:12:14Z","valid_to":null,"version":1},{"brief_section":"Task","change_reason":"Recorded from the task of the brief.","changed_by":"sangrail","constraint_id":"T2","end_reason":null,"lifecycle":"active","meaning":"Show the parts, the flows and where the MVP stops.","mvp":"The [system design](../../design/SYSTEM-DESIGN.md) and its diagram, and the code architecture in [ARCHITECTURE.md](../../ARCHITECTURE.md).","pillar":"scope","source_id":"brief","source_note":null,"standing":"met","statement":"Define the initial phase and create a system design diagram (10 minutes).","title":"Define the initial phase and a system design diagram","valid_from":"2026-10-29T12:12:14Z","valid_to":null,"version":1},{"brief_section":"Task","change_reason":"Recorded from the task of the brief.","changed_by":"sangrail","constraint_id":"T3","end_reason":null,"lifecycle":"active","meaning":"Prove the chain from question to cited answer, running, with tests.","mvp":"Built in about four to five hours rather than 40 minutes, to prove the whole chain with tests and evaluation ([docs/README.md](../README.md)).","pillar":"scope","source_id":"brief","source_note":null,"standing":"met","statement":"Get a working prototype of an MVP (40 minutes).","title":"A working prototype of an MVP","valid_from":"2026-10-29T12:12:14Z","valid_to":null,"version":1},{"brief_section":"Use Case","change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"U1","end_reason":null,"lifecycle":"active","meaning":"The questions are about specific parameters, not general reading. Values must be bound to the element they describe. *Selected* means the users are known and their access differs.","mvp":"Load limits, materials and approval statuses are answered from text (with a binding status) and from table facts through SQL. Only a small, fixed set of parameters is recognised.","pillar":"intent","source_id":"brief","source_note":null,"standing":"partly met","statement":"A selected engineering manager or lead can find a critical engineering parameter: a load limit, a material specification or a compliance approval status.","title":"Find a critical engineering parameter","valid_from":"2026-10-28T20:27:45Z","valid_to":null,"version":1},{"brief_section":"Use Case","change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"U2","end_reason":null,"lifecycle":"active","meaning":"Search must not depend on the user knowing which file to open. The system needs an index, not a scan.","mvp":"Met on 148 test files. Not measured on a real repository, which may hold hundreds of thousands of files.","pillar":"intent","source_id":"brief","source_note":null,"standing":"met","statement":"The parameter is found across 100 or more project documents.","title":"Across 100+ project documents","valid_from":"2026-10-28T20:27:45Z","valid_to":null,"version":1},{"brief_section":"Use Case","change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"U3","end_reason":null,"lifecycle":"active","meaning":"The time includes the network and the chat agent's language model, not only the search. It must hold for every user, not only for one.","mvp":"About 80 ms median per question for one user. Under load, admission control answers within 8 s or refuses at once with a retry time. One process answers about 10 requests a second. Holding 10 s for any number of users is P1.","pillar":"intent","source_id":"brief","source_note":null,"standing":"partly met","statement":"The answer comes in under 10 seconds.","title":"In under 10 seconds","valid_from":"2026-10-28T20:27:45Z","valid_to":null,"version":1},{"brief_section":"Use Case","change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"U4","end_reason":null,"lifecycle":"active","meaning":"Every answer cites the exact file, location and version, and the cited text must really be in the file. The system must prefer no answer to a wrong one, and say how well the value is bound to the question.","mvp":"Every answer and row carries file, page or sheet, lines and SHA-256 version, checked against the files by tests. The source is proven; that the value is the current, approved one is not.","pillar":"intent","source_id":"brief","source_note":null,"standing":"partly met","statement":"The user has 100% confidence in the source of the answer.","title":"With 100% confidence in the source","valid_from":"2026-10-28T20:27:45Z","valid_to":null,"version":1},{"brief_section":"Use Case","change_reason":"First recorded with the use case and the constraints of the brief.","changed_by":"sangrail","constraint_id":"U5","end_reason":null,"lifecycle":"active","meaning":" es OCR and the CAD formats DXF, DWG, JT and CATIA. The MVP must prove the full path from a question to an answer with an exact source (U4, U5) before the system takes on complex formats. A real repository holds many formats and versions (C2), so the format boundary must stay open for later readers ([ADR 0003](0003-versioned-reader-selection.md)).","heading":"Context","number":1,"position":1,"version":1},{"body":"- Read UTF-8 Markdown and PDF files that have a text layer.\n- \"Simple PDF\" means text that a library can extract, with the page number as its location. OCR, encrypted files, embedded drawings, complex table reconstruction and layout analysis are out of scope.\n- Markdown passages keep line numbers. PDF passages keep the page number and the line numbers in the extracted page text.\n- A location proves where the text came from. It does not prove that an engineering value is approved or correct.\n- Semantic search, CAD geometry, the decision about which document is the authority, and production distribution are later work.","heading":"Decision","number":1,"position":2,"version":1},{"body":"- The user sees the exact text and its file, page and lines, so the user does not need to open the PDF (U5).\n- A PDF with some text does not mean that all its pages, tables or images are searchable. A scanned page gives no text.\n- The 10-second target (U3) is measured on the test corpus only. It is not a promise for any file or any computer.","heading":"Consequences","number":1,"position":3,"version":1},{"body":"Done, and extended. The [indexing package](../../engineering_search/indexing/) detects the type from the content ([ADR 0003](0003-versioned-reader-selection.md)) and has readers for Markdown (text and pipe tables) and PDF (text layer, page by page with pypdf, at most 15 lines in each passage). [ADR 0016](0016-structured-facts-and-client-written-sql.md) adds CSV and XLSX readers for structured data. No OCR, no Word, no CAD content: scans and CAD files are listed in the coverage report as gaps. A file that cannot be read is skipped and reported ([ADR 0005](0005-coverage-and-reader-gaps.md)). Uploads accept Markdown only. Tests: `tests/test_indexer.py`, `tests/test_coverage.py`, `tests/test_index.py`, `tests/test_use_case.py`.","heading":"Implementation","number":1,"position":4,"version":1},{"body":"The brief limits the MVP to Markdown and simple PDF (S2). It excludes OCR and the CAD formats DXF, DWG, JT and CATIA. The MVP must prove the full path from a question to an answer with an exact source (U4, U5) before the system takes on complex formats. A real repository holds many formats and versions (C2), so the format boundary must stay open for later readers ([ADR 0003](0003-versioned-reader-selection.md)).","heading":"Context","number":1,"position":1,"version":2},{"body":"- Read UTF-8 Markdown and PDF files that have a text layer.\n- \"Simple PDF\" means text that a library can extract, with the page number as its location. OCR, encrypted files, embedded drawings, complex table reconstruction and layout analysis are out of scope.\n- Markdown passages keep line numbers. PDF passages keep the page number and the line numbers in the extracted page text.\n- A location proves where the text came from. It does not prove that an engineering value is approved or correct.\n- Semantic search, CAD geometry, the decision about which document is the authority, and production distribution are later work.","heading":"Decision","number":1,"position":2,"version":2},{"body":"- The user sees the exact text and its file, page and lines, so the user does not need to open the PDF (U5).\n- A PDF with some text does not mean that all its pages, tables or images are searchable. A scanned page gives no text.\n- The 10-second target (U3) is measured on the test corpus only. It is not a promise for any file or any computer.","heading":"Consequences","number":1,"position":3,"version":2},{"body":"Done, and extended. The [indexing package](../../engineerin
